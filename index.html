<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선택과목 변경 관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 교무 업무용 2단 작업 화면 — 왼쪽 학생 목록, 오른쪽 변경 작업대. 상단은 시트 연결 상태 */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#f6f7f9; --line:#e3e6eb; --line-2:#cdd2da;
  --ink:#131820; --ink-2:#4b5361; --ink-3:#7e8694;
  --accent:#0f6b58; --accent-ink:#ffffff; --accent-weak:#e5f2ee;
  --draft:#5b6576; --draft-weak:#eef0f3;
  --pending:#a8650c; --pending-weak:#fbf1e1;
  --done:#17784c; --done-weak:#e4f4ea;
  --bad:#b42318; --bad-weak:#fdecea;
  --paper:#ffffff; --paper-ink:#111111;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#161a20; --sunk:#1b2028; --line:#262c36; --line-2:#343c48;
  --ink:#e8ebf0; --ink-2:#aab2bf; --ink-3:#7d8694;
  --accent:#4cc3a5; --accent-ink:#06261f; --accent-weak:#143029;
  --draft:#aab2bf; --draft-weak:#232933;
  --pending:#f0b45a; --pending-weak:#33270f;
  --done:#5fd197; --done-weak:#12301f;
  --bad:#f28b82; --bad-weak:#3a1714;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#161a20; --sunk:#1b2028; --line:#262c36; --line-2:#343c48;
  --ink:#e8ebf0; --ink-2:#aab2bf; --ink-3:#7d8694;
  --accent:#4cc3a5; --accent-ink:#06261f; --accent-weak:#143029;
  --draft:#aab2bf; --draft-weak:#232933;
  --pending:#f0b45a; --pending-weak:#33270f;
  --done:#5fd197; --done-weak:#12301f;
  --bad:#f28b82; --bad-weak:#3a1714;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;line-height:1.3;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}

/* 상단 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand h1{font-size:17px}
.brand p{font-size:13px;color:var(--ink-3)}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
.nav button{border:0;background:transparent;padding:9px 14px;font-size:15px;border-radius:8px;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-weight:500}
.nav button[aria-selected="true"]{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.conn{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--done)} .dot.demo{background:var(--pending)}

.page{max-width:1280px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}

/* 공통 요소 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px}
.panel-b{padding:22px;display:flex;flex-direction:column;gap:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:9px;padding:9px 14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.done{background:var(--done);border-color:var(--done);color:#fff}
.btn.warn{color:var(--pending);border-color:var(--pending)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line-2))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.lg{padding:12px 20px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible,.srow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;font-size:15.5px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--ink-2);font-weight:500}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.err{background:var(--bad-weak);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px}
.info{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-size:14.5px;color:var(--ink-2)}

/* 상태 표시 */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 9px 2px 8px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-작성{background:var(--draft-weak);color:var(--draft)}
.st-처리중{background:var(--pending-weak);color:var(--pending)}
.st-접수완료{background:var(--done-weak);color:var(--done)}
.st-취소{background:var(--sunk);color:var(--ink-3)}
.st-none{background:transparent;color:var(--ink-3);padding-left:0}
.st-none::before{display:none}

/* 요약 수치 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px 18px}
.kpi .k{font-size:13.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--f-num);font-size:28px;font-weight:500;margin-top:2px}

/* 학생 작업 화면 */
.work{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:1fr}}
.list-tools{display:flex;flex-direction:column;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.slist{max-height:calc(100vh - 260px);min-height:260px;overflow:auto}
@media (max-width:900px){.slist{max-height:320px}}
.srow{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;font-size:15.5px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:3px solid transparent;width:100%;text-align:left;border-top:0;border-right:0}
.srow:hover{background:var(--sunk)}
.srow[aria-current="true"]{background:var(--accent-weak);border-left-color:var(--accent)}
.srow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-foot{padding:10px 16px;font-size:13px;color:var(--ink-3)}

.who{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px}
.who h2{font-size:24px}
.who .meta{color:var(--ink-3);font-size:14.5px}

/* 진행 단계 */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.flow div{padding:12px 14px;font-size:13.5px;color:var(--ink-3);background:var(--sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.flow div:last-child{border-right:0}
.flow div b{font-weight:600;color:var(--ink-2)}
.flow div.on{background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.flow div.on b{color:var(--ink)}
.flow div.ok b{color:var(--done)}

/* 과목 */
.sems{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.sems{grid-template-columns:1fr}}
.sem{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sem-h{display:flex;justify-content:space-between;padding:9px 14px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.sem ol{list-style:none;margin:0;padding:4px 0;counter-reset:n}
.sem li{counter-increment:n;display:flex;gap:12px;align-items:baseline;padding:8px 14px;font-size:15.5px}
.sem li::before{content:counter(n);font-family:var(--f-num);font-size:12.5px;color:var(--ink-3);width:12px;flex:none}
.sem .out{color:var(--ink-3);text-decoration:line-through}
.sem .to{color:var(--accent);font-weight:600}
.sem li.chg{background:var(--accent-weak)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:0 6px;border-radius:4px;background:var(--sunk);color:var(--ink-3);border:1px solid var(--line);margin-left:4px;vertical-align:1px}

.chgrow{display:grid;grid-template-columns:120px minmax(0,1fr) 20px minmax(0,1fr) auto;gap:8px;align-items:center}
.chgrow .arr{color:var(--ink-3);text-align:center}
@media (max-width:620px){.chgrow{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:8px}.chgrow .arr{display:none}.chgrow .s{grid-column:1/-1}}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg label{padding:8px 16px;cursor:pointer;font-size:15px;color:var(--ink-2);border-right:1px solid var(--line-2)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--surface)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.fields{grid-template-columns:1fr}}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 22px;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 var(--r) var(--r)}
.confirm{border:1px solid var(--done);background:var(--done-weak);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm ul{margin:0;padding-left:1.2em}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink);font-size:15px;font-weight:600}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--ink-2)}

/* 표 */
.tbl{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t th,table.t td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:13px;letter-spacing:.04em;color:var(--ink-3);font-weight:600;background:var(--sunk);white-space:nowrap}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--sunk)}
table.t td.n,table.t th.n{text-align:right}
.pre{white-space:pre-line}
.up{color:var(--done);font-weight:600}.dn{color:var(--bad);font-weight:600}

/* 설정 */
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
code{font-family:var(--f-num);font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 5px;word-break:break-all}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);
  padding:10px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.busy{opacity:.55;pointer-events:none}

/* 인쇄 양식 (안내문 [양식1]·[양식2]) */
.paper{background:#fff;color:#111;max-width:720px;margin:0 auto;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:13px;line-height:1.5}
.paper h2{text-align:center;font-size:20px;letter-spacing:.3em;margin:4px 0 14px;font-weight:700}
.paper .formno{font-size:12px;color:#444}
.paper table{border-collapse:collapse;width:100%}
.paper td,.paper th{border:1px solid #333;padding:6px 8px;vertical-align:middle}
.paper th{background:#eef1f5;font-weight:600}
.paper .ck{width:110px;text-align:center;white-space:nowrap}
.paper .sig{display:flex;justify-content:flex-end;margin-top:6px}
.paper .foot{text-align:center;font-weight:700;font-size:16px;margin-top:14px;letter-spacing:.1em}
.paper .pb{break-before:page}
.paper-doc + .paper-doc{break-before:page}
#printArea{display:none}
@media print{
  @page{size:A4;margin:16mm 14mm}
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><div class="mark" aria-hidden="true">신당</div>
      <div><h1>선택과목 변경 관리</h1><p id="brandSub">천안신당고 교육과정부</p></div></div>
    <nav class="nav" role="tablist" id="nav"></nav>
    <div class="conn" id="conn"></div>
  </div>
</header>
<main class="page" id="page"></main>
<div id="printArea"></div>

<script src="config.js"></script>
<script>
/* ════════ 기본 정보 ════════ */

    1:[['국어','문학'],['국어','독서토론과 글쓰기'],['영어','영어Ⅰ'],['수학','대수'],['사회','사회와 문화'],['사회','세계사'],['사회','세계시민과 지리'],['사회','현대사회와 윤리'],['과학','물리학'],['과학','화학'],['과학','생명과학'],['과학','지구과학'],['체육','기초 체육 전공실기','pe'],['기술·가정','로봇과 공학세계'],['정보','인공지능기초'],['제2외국어','일본어'],['제2외국어','중국어'],['한문','한문']],
    2:[['국어','독서와 작문'],['영어','영어Ⅱ'],['영어','실생활 영어 회화'],['수학','미적분Ⅰ'],['수학','기하'],['사회','사회와 문화'],['사회','세계사'],['사회','세계시민과 지리'],['사회','현대사회와 윤리'],['사회','동아시아 역사기행'],['사회','한국지리 탐구'],['과학','물리학'],['과학','화학'],['과학','생명과학'],['과학','지구과학'],['과학','전자기와 양자','sci'],['과학','화학 반응의 세계','sci'],['과학','세포와 물질대사','sci'],['과학','지구시스템과학','sci'],['체육','고급 체육 전공실기','pe'],['기술·가정','로봇과 공학세계'],['정보','인공지능기초'],['제2외국어','일본어'],['제2외국어','중국어'],['한문','한문']]}},
  '2':{label:'현 2학년 → 2027학년도 3학년 과정',course:3,tab:'2학년 과목선택',n1:7,n2:7,sciCol:'',subj:{

var Google=(function(){

      client.callback=function(r){if(r.error)return rej(new Error('구글 연결이 취소되었어요.'));tok=r.access_token;exp=Date.now()+(+r.expires_in||3600)*1000;res(tok)};

        headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});

      if(r.status===401&&!retry){tok=null;return api(path,opt,true)}

          if(r.status===404)m='시트를 찾지 못했어요. 설정의 시트 주소를 확인해 주세요.';

      if(names.indexOf(CFG.dbSheet)<0)throw new Error('「'+CFG.dbSheet+'」 탭이 없어요. 시트 탭 이름: '+names.join(', '));

        .then(function(){return api('/values/'+encodeURIComponent(q(LOG_SHEET)+'!A1')+'?valueInputOption=RAW',{method:'PUT',body:{values:[LOG_HEAD]}})});

    load:function(){

        var r=[q(CFG.dbSheet)+'!A2:'+LAST,q(CFG.dbSheet)+'!'+(P.sciCol||'A')+'2:'+(P.sciCol||'A'),q(LOG_SHEET)+'!A2:O'].map(function(x){return 'ranges='+encodeURIComponent(x)}).join('&');

function parseLog(l){

      createdAt:r[9]||'',printedAt:r[10]||'',doneAt:r[11]||'',before:j(r[12],{sem1:[],sem2:[]}),after:j(r[13],null),changes:j(r[14],[]),logRow:i+2};

}
function toLogRow(q){

/* ════════ 학생 ════════ */
function kpis(){

  return '<div class="kpis">'
    +'<div class="panel kpi"><div class="k">전체 학생</div><div class="v">'+D.students.length+'</div></div>'
    +'<div class="panel kpi"><div class="k"><span class="st st-작성">작성</span></div><div class="v">'+c['작성']+'</div></div>'
    +'<div class="panel kpi"><div class="k"><span class="st st-처리중">처리중</span> 서명 대기</div><div class="v">'+c['처리중']+'</div></div>'
    +'<div class="panel kpi"><div class="k"><span class="st st-접수완료">접수완료</span> 시트 반영</div><div class="v">'+c['접수완료']+'</div></div></div>';
}

    if(V.cls&&clsOf(s.id)!==+V.cls)return false;
    if(q&&(s.id+s.name.replace(/\s+/g,'').toLowerCase()).indexOf(q)<0)return false;
    var st=stOf(s.id);
    if(V.filter==='open')return st==='작성'||st==='처리중';

    +'<input type="search" id="q" placeholder="이름 (또는 학번)" value="'+esc(V.q)+'" aria-label="이름으로 찾기"></div>'
    +'<div class="chips" role="group" aria-label="상태 거르기">'+[['all','전체'],['open','신청 중'],['pending','처리중'],['done','접수완료']].map(function(x){return '<button type="button" data-f="'+x[0]+'" aria-pressed="'+(V.filter===x[0])+'">'+x[1]+'</button>'}).join('')+'</div></div>'
    +'<div class="slist" id="slist">'+rows.map(function(s){var st=stOf(s.id);return '<button type="button" class="srow" data-id="'+s.id+'" aria-current="'+(V.cur&&V.cur.id===s.id)+'"><span class="num muted">'+s.id+'</span><span class="nm">'+esc(s.name)+'</span>'+(st?'<span class="st st-'+st+'">'+st+'</span>':'<span></span>')+'</button>'}).join('')
    +(rows.length?'':'<div class="empty small">조건에 맞는 학생이 없어요.</div>')+'</div>'
    +'<div class="list-foot">'+rows.length+'명 표시 · 시트 행 순서와 관계없이 학번순</div></section>'
    +'<section class="panel" aria-label="변경 작업" id="detail">'+detailHtml()+'</section></div>';
  page.innerHTML=h;

  qi.addEventListener('input',function(){V.q=qi.value;var p=qi.selectionStart;studentsView();var n=$('#q');n.focus();n.setSelectionRange(p,p)});
  $('#cls').addEventListener('change',function(e){V.cls=e.target.value;studentsView()});
  $$('[data-f]').forEach(function(b){b.addEventListener('click',function(){V.filter=b.getAttribute('data-f');studentsView()})});
  $$('.srow').forEach(function(b){b.addEventListener('click',function(){select(findSt(b.getAttribute('data-id')))})});

function select(s){V.cur=s;V.confirm=false;V.edit=false;V.msg='';loadForm(s);studentsView();if(window.innerWidth<900)$('#detail').scrollIntoView({block:'start'})}

function afterOf(s,changes){

}

    +'<div class="'+(idx===2?'ok':'')+'"><b>3 접수완료</b><span>서명본 회수 → 시트 반영</span></div></div>';
  if(V.msg)h+='<div class="info">'+V.msg+'</div>';

  }else{

      +'<div><div class="eyebrow" style="margin-bottom:8px">변경 신청 과목 · 최대 '+MAX_CHANGES+'건</div><div class="stack" id="chg" style="display:flex;flex-direction:column;gap:8px">'+f.changes.map(chgRow).join('')+'</div>'
      +'<button class="btn ghost" type="button" id="addChg" style="margin-top:6px"'+(f.changes.length>=MAX_CHANGES?' disabled':'')+'>+ 변경 과목 추가</button></div>'
      +'<label class="f">변경 사유 <span class="muted" style="font-weight:400">비워 두면 양식에 빈칸으로 인쇄되어 학생이 직접 씁니다</span><textarea id="reason">'+esc(f.reason)+'</textarea></label>';
  }
  var hist=histOf(s.id);
  if(hist.length)h+='<div><div class="eyebrow" style="margin-bottom:8px">지난 처리</div><div class="hist">'+hist.map(function(r){return '<div><span class="st st-'+r.status+'">'+r.status+'</span><span class="num">'+esc(r.doneAt||r.printedAt||r.createdAt)+'</span><span class="pre">'+esc(summary(r).replace(/\n/g,' · '))+'</span></div>'}).join('')+'</div></div>';
  if(V.confirm){

      +f.changes.map(function(c){return '<li>'+c.sem+'학기 <b>'+esc(c.from)+'</b> → <b>'+esc(c.to)+'</b></li>'}).join('')+'</ul>'
      +'<span class="small muted">「'+esc(CFG.dbSheet)+'」 '+s.row+'행의 B~'+LAST+'열이 바뀌고, 「'+LOG_SHEET+'」 탭에 기존 과목과 함께 기록됩니다.</span>'

function ox(name,label,val){
  return '<div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:500">'+label+'<span class="seg" role="radiogroup" aria-label="'+label+'">'
    +[['O','O'],['X','X'],['','비움']].map(function(v){return '<label><input type="radio" name="'+name+'" value="'+v[0]+'"'+(val===v[0]?' checked':'')+'>'+v[1]+'</label>'}).join('')+'</span></div>';
}
function chgRow(c,i){
  var s=V.cur,sem=String(c.sem||''),f=V.form;
  var others=f.changes.filter(function(x,j){return j!==i&&String(x.sem)===sem});
  var uf=others.map(function(x){return norm(x.from)}),ut=others.map(function(x){return norm(x.to)});
  var cur=sem?(sem==='1'?s.raw1:s.raw2).filter(String):[];
  var h='<div class="chgrow" data-i="'+i+'"><select class="s" aria-label="학기"><option value="">학기</option><option value="1"'+(sem==='1'?' selected':'')+'>1학기</option><option value="2"'+(sem==='2'?' selected':'')+'>2학기</option></select>'
    +'<select class="fr" aria-label="기존 과목"'+(sem?'':' disabled')+'><option value="">기존 과목</option>';
  cur.forEach(function(x){if(uf.indexOf(norm(x))<0)h+='<option'+(norm(x)===norm(c.from)?' selected':'')+'>'+esc(x)+'</option>'});
  h+='</select><span class="arr" aria-hidden="true">→</span><select class="to" aria-label="변경 과목"'+(sem?'':' disabled')+'><option value="">변경 과목</option>';
  if(sem){var cn=cur.map(norm),g='';SUBJ[sem].forEach(function(x){if(cn.indexOf(norm(x[1]))>=0||ut.indexOf(norm(x[1]))>=0)return;
    if(x[0]!==g){if(g)h+='</optgroup>';g=x[0];h+='<optgroup label="'+esc(g)+'">'}
    h+='<option value="'+esc(x[1])+'"'+(norm(x[1])===norm(c.to)?' selected':'')+'>'+esc(x[1])+(x[2]==='sci'?' · 과학 진로':x[2]==='pe'?' · 체육특성화':'')+'</option>'});if(g)h+='</optgroup>'}
  return h+'</select><button class="btn ghost" type="button" data-del="'+i+'" aria-label="이 줄 삭제">삭제</button></div>';
}
function semView(r1,r2,changes,showPos){
  function col(sem,raw){
    var map={};(changes||[]).forEach(function(c){if(String(c.sem)===String(sem)&&c.from&&c.to)map[norm(c.from)]=c.to});
    var list=raw.filter(String);
    return '<div class="sem"><div class="sem-h"><span>'+sem+'학기</span><span class="num">'+list.length+'과목</span></div><ol>'+list.map(function(x){
      var to=map[norm(x)];
      return to?'<li class="chg"><span><span class="out">'+esc(x)+'</span> → <span class="to">'+esc(to)+'</span>'+tagHtml((subjInfo(sem,to)||[])[2])+'</span></li>'
               :'<li><span>'+esc(x)+tagHtml((subjInfo(sem,x)||[])[2])+'</span></li>';
    }).join('')+'</ol></div>';
  }
  return '<div class="sems">'+col(1,r1)+col(2,r2)+'</div>';
}
function bindDetail(){
  if(!V.cur)return;
  var f=V.form;
  var chg=$('#chg');
  if(chg){
    chg.addEventListener('change',function(e){var row=e.target.closest('.chgrow');if(!row)return;var c=f.changes[+row.getAttribute('data-i')];
      if(e.target.classList.contains('s')){c.sem=e.target.value;c.from='';c.to=''}
      if(e.target.classList.contains('fr'))c.from=e.target.value;
      if(e.target.classList.contains('to'))c.to=e.target.value;
      refreshDetail()});
    chg.addEventListener('click',function(e){var d=e.target.getAttribute('data-del');if(d==null)return;f.changes.splice(+d,1);if(!f.changes.length)f.changes.push({sem:'',from:'',to:''});refreshDetail()});
    $('#addChg').addEventListener('click',function(){if(f.changes.length<MAX_CHANGES){f.changes.push({sem:'',from:'',to:''});refreshDetail()}});
    $$('input[name=science],input[name=pe]').forEach(function(r){r.addEventListener('change',function(){f[r.name]=r.value})});
    $('#reason').addEventListener('input',function(e){f.reason=e.target.value});
    $('#fDate').addEventListener('change',function(e){f.date=e.target.value});
  }
  var on=function(id,fn){var b=$('#'+id);if(b)b.addEventListener('click',fn)};
  on('doSave',function(){persist('작성').then(function(){V.msg='작성 내용을 저장했어요. 인쇄하면 「처리중」이 됩니다.';studentsView()})});
  on('doPrint',function(){persist('처리중',true).then(function(r){printPapers([r]);V.msg='인쇄했어요. 보호자 서명본을 받아 오면 「서명본 접수 완료」를 눌러 시트에 반영하세요.';studentsView()})});
  on('reprint',function(){printPapers([f])});
  on('unlock',function(){V.edit=true;V.msg='내용을 고치면 다시 인쇄해야 합니다.';refreshDetail()});
  on('askApply',function(){V.confirm=true;refreshDetail()});
  on('noApply',function(){V.confirm=false;refreshDetail()});
  on('doApply',applyNow);
  var cb=$('#cancelReq'),armed=false;
  if(cb)cb.addEventListener('click',function(){if(!armed){armed=true;cb.textContent='한 번 더 누르면 취소됩니다';return}
    f.status='취소';f.doneAt=nowStr();busy(true);Store.saveRequest(f).then(function(){toast('신청을 취소했어요.');return reload()}).then(function(){V.confirm=false;V.edit=false;V.msg=''}).catch(fail)});
}
function refreshDetail(){$('#detail').innerHTML=detailHtml();bindDetail()}
function busy(on){var d=$('#detail');if(d)d.classList.toggle('busy',on)}
function fail(e){busy(false);toast(errMsg(e))}
function validChanges(){
  var f=V.form,filled=f.changes.filter(function(c){return c.sem||c.from||c.to});
  if(!filled.length){toast('변경할 과목을 1개 이상 골라 주세요.');return null}
  if(filled.some(function(c){return !(c.sem&&c.from&&c.to)})){toast('비어 있는 칸이 있는 변경 줄이 있어요.');return null}
  return filled;
}
/** 저장: 상태를 정하고 「변경신청」 탭에 기록 */
function persist(status,printing){
  var f=V.form,s=V.cur,ch=validChanges();
  if(!ch)return Promise.reject(new Error('cancel'));
  f.changes=ch;f.status=status;f.id=s.id;f.name=s.name;
  if(!f.no)f.no='R'+Date.now().toString(36).toUpperCase();
  if(!f.createdAt)f.createdAt=nowStr();
  f.before={sem1:s.raw1.slice(),sem2:s.raw2.slice()};
  if(printing)f.printedAt=nowStr();
  busy(true);
  return Store.saveRequest(f).then(function(r){
    var i=D.requests.findIndex(function(x){return x.logRow===r.logRow});var c=JSON.parse(JSON.stringify(r));
    if(i>=0)D.requests[i]=c;else D.requests.push(c);
    V.edit=false;busy(false);return r;
  }).catch(function(e){if(e.message!=='cancel')fail(e);throw e});
}
function applyNow(){
  var f=V.form,s=V.cur,after=afterOf(s,f.changes);
  f.status='접수완료';f.doneAt=nowStr();f.after=after;busy(true);
  Store.apply(f,s,after).then(function(){toast(s.name+' 학생의 변경을 시트에 반영했어요.');V.confirm=false;V.msg='';return reload()})
    .then(function(){V.msg='접수 완료. 시트의 과목이 바뀌었습니다.';studentsView()})
    .catch(function(e){f.status='처리중';f.doneAt='';f.after=null;V.confirm=false;fail(e);refreshDetail()});
}

/* ════════ 신청 현황 ════════ */
function requestsView(){
  var list=D.requests.slice().sort(function(a,b){var o={처리중:0,작성:1,접수완료:2,취소:3};return (o[a.status]-o[b.status])||(a.id<b.id?-1:1)});
  var ids=Object.keys(V.sel).filter(function(k){return V.sel[k]});
  var h=kpis()+'<section class="panel"><div class="panel-h"><h2>신청 현황</h2><div class="row">'
    +'<button class="btn primary" type="button" id="printSel"'+(ids.length?'':' disabled')+'>선택 인쇄 / PDF 저장 ('+ids.length+')</button>'
    +'<button class="btn" type="button" id="csv">'+(ids.length?'선택':'전체')+' 엑셀 저장</button></div></div>';
  if(!list.length)h+='<div class="empty"><b>아직 신청이 없어요</b><span>「학생」 탭에서 학생을 골라 변경 내용을 작성하세요.</span></div>';
  else h+='<div class="tbl"><table class="t"><thead><tr><th><input type="checkbox" id="selAll" aria-label="모두 선택"></th><th>상태</th><th>학번</th><th>이름</th><th>변경 내역</th><th>사유</th><th>출력</th><th>접수완료</th></tr></thead><tbody>'
    +list.map(function(r){return '<tr class="click" data-id="'+r.id+'" data-row="'+r.logRow+'"><td><input type="checkbox" class="sel" value="'+r.logRow+'"'+(V.sel[r.logRow]?' checked':'')+' aria-label="'+r.id+' 선택"></td>'
      +'<td><span class="st st-'+r.status+'">'+r.status+'</span></td><td class="num">'+r.id+'</td><td>'+esc(r.name)+'</td><td class="pre small">'+esc(summary(r))+'</td><td class="small muted" style="max-width:260px">'+esc(r.reason||'')+'</td><td class="num small">'+esc(r.printedAt)+'</td><td class="num small">'+esc(r.doneAt&&r.status==='접수완료'?r.doneAt:'')+'</td></tr>'}).join('')
    +'</tbody></table></div><div class="list-foot">선택 인쇄하면 「작성」 상태는 「처리중」으로 바뀝니다. 학생마다 새 쪽에서 확인서 → 신청서 순으로 인쇄됩니다. 행을 누르면 그 학생 작업 화면으로 갑니다.</div>';
  page.innerHTML=h+'</section>';
  $$('.sel').forEach(function(c){c.addEventListener('click',function(e){e.stopPropagation()});c.addEventListener('change',function(){V.sel[c.value]=c.checked;requestsView()})});
  var all=$('#selAll');if(all)all.addEventListener('change',function(e){list.forEach(function(r){V.sel[r.logRow]=e.target.checked});requestsView()});
  $$('tr.click').forEach(function(tr){tr.addEventListener('click',function(){V.tab='students';select(findSt(tr.getAttribute('data-id')))})});
  $('#csv').addEventListener('click',function(){saveCsv(ids.length?list.filter(function(r){return V.sel[r.logRow]}):list)});
  $('#printSel').addEventListener('click',function(){
    var pick=list.filter(function(r){return V.sel[r.logRow]});if(!pick.length)return;
    var drafts=pick.filter(function(r){return r.status==='작성'}),t=nowStr();
    var b=$('#printSel');b.disabled=true;b.textContent='준비 중…';
    drafts.reduce(function(p,r){return p.then(function(){r.status='처리중';r.printedAt=t;return Store.saveRequest(r)})},Promise.resolve())
      .then(function(){printPapers(pick);toast(drafts.length?drafts.length+'건이 「처리중」으로 바뀌었어요.':'인쇄 창을 열었어요.');requestsView()})
      .catch(function(e){toast(errMsg(e));requestsView()});
  });
}
function saveCsv(rows){
  var head=['상태','학번','반','번호','이름','변경내역','변경사유','과학중점 희망','체육특성화 희망','신청일','출력일시','접수완료일시'];
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var lines=[head.join(',')].concat(rows.map(function(r){return [r.status,r.id,clsOf(r.id),noOf(r.id),r.name,summary(r).replace(/\n/g,' / '),r.reason,r.science,r.pe,r.date,r.printedAt,r.status==='접수완료'?r.doneAt:''].map(q).join(',')}));
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='선택과목변경_'+todayStr()+'.csv';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast(rows.length+'건을 엑셀(CSV)로 저장했어요.');
}

/* ════════ 과목별 인원 ════════ */
function countView(){
  var h='<section class="panel"><div class="panel-h"><h2>과목별 인원</h2><span class="small muted">현재 인원은 시트 기준(접수완료 반영됨). 진행 중은 작성·처리중 신청을 더한 값. 일반선택 26명 편성 기준 확인용</span></div><div class="panel-b">';
  [1,2].forEach(function(sem){
    var cnt={},dl={};
    D.students.forEach(function(s){(sem===1?s.raw1:s.raw2).forEach(function(x){if(x)cnt[norm(x)]=(cnt[norm(x)]||0)+1})});
    D.requests.forEach(function(r){if(r.status!=='작성'&&r.status!=='처리중')return;r.changes.forEach(function(c){if(+c.sem!==sem)return;dl[norm(c.from)]=(dl[norm(c.from)]||0)-1;dl[norm(c.to)]=(dl[norm(c.to)]||0)+1})});
    var fm=function(n){return n>0?'<span class="up">+'+n+'</span>':n<0?'<span class="dn">'+n+'</span>':'<span class="muted">0</span>'};
    h+='<div><div class="eyebrow" style="margin-bottom:8px">'+sem+'학기</div><div class="tbl" style="border:1px solid var(--line);border-radius:8px"><table class="t"><thead><tr><th>교과(군)</th><th>과목</th><th class="n">현재</th><th class="n">진행 중</th><th class="n">예상</th></tr></thead><tbody>'
      +SUBJ[sem].map(function(x){var k=norm(x[1]),c=cnt[k]||0,d=dl[k]||0;return '<tr><td class="muted">'+esc(x[0])+'</td><td>'+esc(x[1])+tagHtml(x[2])+'</td><td class="n num">'+c+'</td><td class="n num">'+fm(d)+'</td><td class="n num">'+(c+d)+'</td></tr>'}).join('')
      +'</tbody></table></div></div>';
  });
  page.innerHTML=h+'</div></section>';
}

/* ════════ 인쇄 양식 ════════ */
function paperHtml(r){
  r=r||{};

  var ck='예 □ &nbsp;&nbsp;아니오 □',blank='<span style="display:inline-block;width:110px"></span>',nm=r.name?esc(r.name):blank;
  var rows=(r.changes||[]).slice();while(rows.length<5)rows.push({});
  var ox=function(v){return v==='O'?'<b>O</b> &nbsp;/&nbsp; X':v==='X'?'O &nbsp;/&nbsp; <b>X</b>':'O &nbsp;/&nbsp; X'};
  var sign='<div class="sig">학&nbsp;&nbsp;&nbsp;&nbsp;생 : '+nm+' &nbsp;&nbsp;(인)</div><div class="sig">보 호 자 : '+blank+' &nbsp;&nbsp;(인)</div>';
  return '<div class="paper"><div class="formno">[양식1] 변경 신청 확인서</div><h2>선택과목 변경 신청 확인서</h2>'
    +'<table><tr><th style="width:15%">학번</th><td>'+esc(r.id||'')+'</td><th style="width:15%">이름</th><td>'+esc(r.name||'')+'</td></tr></table><div style="height:8px"></div>'
    +'<table><tr><th colspan="2">다음 사항에 대해 확인 후 오른쪽 칸에 예/아니오로 체크하시오.(학생용)</th></tr>'
    +AGREE_STUDENT.map(function(q){return '<tr><td>'+esc(q)+'</td><td class="ck">'+ck+'</td></tr>'}).join('')
    +'<tr><th colspan="2">다음 사항에 대해 확인 후 오른쪽 칸에 예/아니오로 체크하시오.(학부모용)</th></tr>'
    +AGREE_PARENT.map(function(q){return '<tr><td>'+esc(q)+'</td><td class="ck">'+ck+'</td></tr>'}).join('')+'</table>'
    +'<p style="text-align:center;margin-top:12px">위의 사유로 선택과목을 변경하고자 신청서를 제출합니다.</p><p style="text-align:center">'+ds+'</p>'+sign
    +'<div class="foot">천안신당고등학교장 귀하</div><div class="pb"></div>'
    +'<div class="formno">[양식2] 변경 신청서</div><h2>선택과목 변경 신청서</h2>'
    +'<table><tr><th style="width:18%">학년/반/번호</th><td>'+esc(r.id||'')+'</td><th style="width:15%">학생 성명</th><td>'+esc(r.name||'')+'</td></tr>'
    +'<tr><th>과학중점<br>희망여부</th><td style="text-align:center">'+ox(r.science)+'</td><th>체육특성화과정<br>희망여부</th><td style="text-align:center">'+ox(r.pe)+'</td></tr></table><div style="height:8px"></div>'
    +'<table><tr><th colspan="5">선택 변경 신청 과목</th></tr><tr><th colspan="2">기존 선택 과목</th><th rowspan="2" style="width:6%"></th><th colspan="2">변경 신청 과목</th></tr>'

function printPapers(list){
  var p=$('#printArea');p.innerHTML=list.map(function(r){return '<div class="paper-doc">'+paperHtml(r)+'</div>'}).join('');
  setTimeout(function(){window.print()},150);
}
