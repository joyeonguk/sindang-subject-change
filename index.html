<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선택과목 변경 관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style>
/* Layout: 모래색 지면 위 한 장의 판. 왼쪽 번호 목차와 진행률 반원, 가운데 감사 문구 아치, 오른쪽 명조 제목. 아래는 가는 선으로 나눈 작업 공간.
   밝은 모래색 한 가지 테마로 고정 */
:root{
  color-scheme:light;
  --outer:#e7e0d6; --bg:#f1ece4; --side:#e3d9cc; --surface:#f7f3ed; --sunk:#ece5db;
  --line:#d8cdbf; --line-2:#c4b7a7;
  --ink:#2a2521; --ink-2:#5f564c; --ink-3:#978c80;
  --accent:#2a2521; --accent-ink:#f7f3ed; --accent-weak:#e9e1d5;
  --sky:#cfdbe0; --sand:#eadfce;
  --draft:#6f665c; --draft-weak:#e8e1d7;
  --pending:#94632a; --pending-weak:#efe0c9;
  --done:#4e6a50; --done-weak:#dfe6d9;
  --bad:#9b3b30; --bad-weak:#f1ddd7;
  --f-serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-latin:"Cormorant Garamond","Gowun Batang",serif;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Cormorant Garamond","Noto Sans KR",serif;
  --r:3px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--outer)}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--f-ui);font-weight:400;font-size:15.5px;line-height:1.7;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
h1,h2,h3{margin:0;font-weight:400;line-height:1.3;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:lining-nums tabular-nums;font-size:1.08em;letter-spacing:.01em}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}

/* 판 */
.frame{max-width:1320px;margin:0 auto;background:var(--bg);border-radius:4px;
  box-shadow:inset 22px 0 0 var(--side),inset -22px 0 0 var(--side),0 18px 40px -24px rgba(60,45,30,.35);padding:0 58px}
@media (max-width:760px){.frame{box-shadow:0 12px 30px -20px rgba(60,45,30,.35);padding:0 18px}}

/* 머리 부분 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:40px;padding-top:34px;border-bottom:1px solid var(--line);align-items:stretch}
@media (max-width:980px){.hero{grid-template-columns:1fr 240px}.hero .arch-col{order:2}.hero .title-col{order:1}.hero .index-col{order:3;grid-column:1 / -1}}
@media (max-width:640px){.hero{grid-template-columns:1fr;gap:22px}.hero .arch-col{order:2}.hero .index-col{order:3}}
.index-col{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:30px 0 26px}
.nav{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (max-width:980px){.nav{flex-direction:row;flex-wrap:wrap;gap:4px 22px}}
.nav button{border:0;background:transparent;padding:2px 0;cursor:pointer;color:var(--ink-3);font-size:15px;display:flex;align-items:baseline;gap:12px;position:relative}
.nav button .n{font-family:var(--f-latin);font-size:15px;color:var(--ink-3);width:18px}
.nav button .cnt{font-family:var(--f-latin);font-size:13px;color:var(--pending);margin-left:2px}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav button[aria-selected="true"] .n{color:var(--ink)}
.nav button[aria-selected="true"]::before{content:"";position:absolute;left:-26px;top:50%;width:16px;height:1px;background:var(--ink)}
@media (max-width:980px){.nav button[aria-selected="true"]::before{display:none}.nav button[aria-selected="true"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}}
.nav button:hover{color:var(--ink)}
.dial{display:flex;flex-direction:column;gap:2px;color:var(--ink-2)}
.dial svg{width:150px;height:84px;overflow:visible}
.dial .lab{font-size:12.5px;color:var(--ink-3)}
.dial .val{font-family:var(--f-latin);font-size:26px;line-height:1;color:var(--ink)}

.arch-col{display:flex;align-items:flex-end}
.arch{width:100%;aspect-ratio:300/370;max-width:100%;border-radius:150px 150px 0 0;overflow:hidden;position:relative;
  background:linear-gradient(180deg,var(--sky) 0%,#e2e8e7 46.5%,var(--sand) 46.5%,#e4d6c2 100%);display:flex;flex-direction:column;justify-content:flex-end}
@media (max-width:640px){.arch{aspect-ratio:300/300;border-radius:999px 999px 0 0}}
.arch::before{content:"";position:absolute;left:0;right:0;top:46.5%;height:1px;background:rgba(120,100,80,.18)}
.thanks{position:relative;z-index:1;padding:0 26px 28px;text-align:center;display:flex;flex-direction:column;gap:8px}
.thanks .t1{font-family:var(--f-serif);font-size:21px;line-height:1.45;color:var(--ink)}
.thanks .t2{font-size:13px;line-height:1.75;color:var(--ink-2)}

.title-col{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:30px 0 26px}
.idx{font-family:var(--f-latin);font-size:14px;color:var(--ink-3);letter-spacing:.04em}
.display{font-family:var(--f-serif);font-size:44px;line-height:1.18;letter-spacing:-.01em}
@media (max-width:640px){.display{font-size:34px}}
.sub{font-size:14px;color:var(--ink-2)}
.conn{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--done)} .dot.demo{background:var(--pending)}

.page{padding-block:30px 40px;display:flex;flex-direction:column;gap:26px}
.colophon{border-top:1px solid var(--line);padding:18px 0 26px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:13px}
.colophon span:first-child{font-family:var(--f-serif);color:var(--ink-2)}

/* 첫 화면 */
.gate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 40px;align-items:start}
@media (max-width:820px){.gate{grid-template-columns:1fr}}
.gate-h{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px}
.gate-h h2{font-family:var(--f-serif);font-size:28px}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.gcards{grid-template-columns:1fr}}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:22px 20px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);cursor:pointer}
.gcard:hover{background:var(--sunk)}
.gcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.gcard .gn{font-family:var(--f-latin);font-size:15px;color:var(--ink-3)}
.gcard .gt{font-family:var(--f-serif);font-size:22px;color:var(--ink)}
.gcard .gs{font-size:13px;color:var(--ink-2)}
.gform{display:flex;flex-direction:column;gap:18px;padding:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

/* 공통 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.panel-h h2{font-family:var(--f-serif);font-size:20px}
.panel-b{padding:24px;display:flex;flex-direction:column;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:transparent;color:var(--ink);
  border-radius:999px;padding:9px 18px;font-size:14.5px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#3d3630}
.btn.done{background:var(--done);border-color:var(--done);color:#f7f3ed}
.btn.danger{color:var(--bad);border-color:#d5aaa2}
.btn.ghost{border-color:transparent;color:var(--ink-2);padding:9px 10px}
.btn.lg{padding:12px 24px;font-size:15.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible,.srow:focus-visible,.chips button:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
input[type=text],input[type=password],input[type=date],input[type=search],select,textarea{background:var(--surface);border:0;border-bottom:1px solid var(--line-2);border-radius:0;padding:10px 2px;width:100%;min-width:0;font-size:15.5px;outline:none}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--ink)}
textarea{border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;min-height:110px;resize:vertical;line-height:1.75;font-family:var(--f-ui)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-3)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.eyebrow{font-size:12.5px;letter-spacing:.08em;color:var(--ink-3)}
.err{background:var(--bad-weak);color:var(--bad);border-radius:var(--r);padding:12px 14px;font-size:14px}
.info{background:var(--sunk);border-radius:var(--r);padding:12px 16px;font-size:14.5px;color:var(--ink-2)}

/* 상태 */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px 2px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.st::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.st-작성{background:var(--draft-weak);color:var(--draft)}
.st-처리중{background:var(--pending-weak);color:var(--pending)}
.st-접수완료{background:var(--done-weak);color:var(--done)}
.st-취소{background:transparent;color:var(--ink-3);border:1px solid var(--line)}
.st-none{background:transparent;color:var(--ink-3);padding-left:0}
.st-none::before{display:none}

/* 요약 수치: 가는 선으로 나눈 네 칸 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis .kpi{background:transparent;border:0;border-radius:0;border-left:1px solid var(--line);padding:16px 22px}
.kpis .kpi:first-child{border-left:0;padding-left:0}
@media (max-width:720px){.kpis .kpi:nth-child(3){border-left:0;padding-left:0}.kpis .kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.kpi .k{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.kpi .v{font-family:var(--f-latin);font-size:40px;line-height:1.1;margin-top:4px}

/* 작업 공간 */
.work{display:grid;grid-template-columns:360px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:1fr}}
.list-tools{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 13px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}
.slist{max-height:calc(100vh - 220px);min-height:280px;overflow:auto}
@media (max-width:900px){.slist{max-height:340px}}
.srow{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border:0;border-bottom:1px solid var(--line);
  cursor:pointer;background:transparent;width:100%;text-align:left;font-size:15.5px}
.srow:hover{background:var(--sunk)}
.srow[aria-current="true"]{background:var(--accent-weak);box-shadow:inset 2px 0 0 var(--ink)}
.srow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-foot{padding:10px 18px;font-size:12.5px;color:var(--ink-3)}

.who{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.who h2{font-family:var(--f-serif);font-size:30px}
.who .meta{color:var(--ink-3);font-size:14px}

.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.flow div{padding:12px 16px 12px 0;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line);padding-left:16px}
.flow div:first-child{border-left:0;padding-left:0}
.flow div b{font-weight:400;font-family:var(--f-serif);font-size:16px;color:var(--ink-3)}
.flow div.on b{color:var(--ink)}
.flow div.on{box-shadow:inset 0 -2px 0 var(--ink)}
.flow div.ok b{color:var(--done)}

.sems{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.sems{grid-template-columns:1fr}}
.sem{border-top:1px solid var(--ink)}
.sem-h{display:flex;justify-content:space-between;padding:10px 0 6px;font-size:13px;color:var(--ink-2)}
.sem-h span:first-child{font-family:var(--f-serif);font-size:16px;color:var(--ink)}
.sem ol{list-style:none;margin:0;padding:0;counter-reset:n}
.sem li{counter-increment:n;display:flex;gap:14px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.sem li::before{content:"0" counter(n);font-family:var(--f-latin);font-size:14px;color:var(--ink-3);width:18px;flex:none}
.sem .out{color:var(--ink-3);text-decoration:line-through}
.sem .to{color:var(--ink);border-bottom:1px solid var(--ink)}
.sem li.chg{background:linear-gradient(90deg,var(--accent-weak),transparent)}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3);margin-left:6px;vertical-align:2px}

.chgrow{display:grid;grid-template-columns:120px minmax(0,1fr) 24px minmax(0,1fr) auto;gap:12px;align-items:end}
.chgrow .arr{color:var(--ink-3);text-align:center;padding-bottom:10px}
@media (max-width:620px){.chgrow{grid-template-columns:1fr 1fr;padding:12px 0;border-bottom:1px solid var(--line)}.chgrow .arr{display:none}.chgrow .s{grid-column:1/-1}}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.seg label{padding:6px 16px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:1.5px solid var(--ink);outline-offset:-3px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:720px){.fields{grid-template-columns:1fr}}
.fields .f{font-size:13px!important;color:var(--ink-3)!important;font-weight:400!important}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 24px;border-top:1px solid var(--line)}
.confirm{border-top:1px solid var(--done);border-bottom:1px solid var(--done);background:var(--done-weak);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.confirm > b{font-weight:400;font-family:var(--f-serif);font-size:17px}
.confirm ul{margin:0;padding-left:1.2em}
.empty{padding:56px 24px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-weight:400;font-family:var(--f-serif);color:var(--ink);font-size:21px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;color:var(--ink-2);padding:8px 0;border-bottom:1px solid var(--line)}

/* 표 */
.tbl{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t th,table.t td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:400;white-space:nowrap;border-bottom:1px solid var(--ink-2)}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--sunk)}
table.t td.n,table.t th.n{text-align:right}
.pre{white-space:pre-line}
.up{color:var(--done)}.dn{color:var(--bad)}

.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--sunk);border-radius:3px;padding:1px 6px;word-break:break-all}
a{color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--accent-ink);
  padding:11px 20px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.busy{opacity:.55;pointer-events:none}

/* 시트 보기 */
iframe.gsheet{width:100%;height:75vh;min-height:480px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
@media (max-width:640px){iframe.gsheet{height:70vh;min-height:380px}}
.sheet-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.sheet th,table.sheet td{padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;text-align:left;vertical-align:top}
table.sheet th{position:sticky;top:0;z-index:2;background:var(--sunk);color:var(--ink-2);font-weight:500;font-size:12px}
table.sheet .nm{position:sticky;left:0;z-index:1;background:var(--surface);font-weight:500}
table.sheet th.nm{z-index:3;background:var(--sunk)}
table.sheet td.n{font-family:var(--f-num);color:var(--ink-3);text-align:right}
table.sheet td.wrap{white-space:normal;min-width:220px;max-width:340px}
table.sheet td.chg,.chg-key{background:var(--done-weak);color:var(--done);font-weight:500}
.chg-key{padding:0 4px;border-radius:2px}
table.sheet tbody tr:hover td{background:var(--sunk)}
table.sheet tbody tr:hover td.chg{background:var(--done-weak)}

/* 크리스마스 장식 (귀엽게, 과하지 않게) */
.xmas-scene{position:relative;display:flex;align-items:flex-end;gap:6px;margin:8px 0 0 2px;width:190px}
.xmas-scene .tree{width:84px;height:auto}
.xmas-scene .rudolph{width:52px;height:auto;margin-bottom:4px}
.xmas-note{position:absolute;left:84px;top:-6px;font-family:var(--f-latin);font-style:italic;font-size:17px;color:#b0453a;letter-spacing:.02em;white-space:nowrap}
@media (max-width:980px){.xmas-scene{display:none}}
.tree .star{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.tree .lights circle{animation:blink 2.2s ease-in-out infinite}
.tree .lights circle:nth-child(2n){animation-delay:.7s}.tree .lights circle:nth-child(3n){animation-delay:1.4s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(8deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.rudolph .r-body{transform-origin:45px 118px;animation:hop 1.4s ease-in-out infinite}
.rudolph .r-arm-r{transform-origin:70px 64px;animation:wave .7s ease-in-out infinite}
.rudolph .r-arm-l{transform-origin:19px 64px;animation:wave2 1.2s ease-in-out infinite}
body.music-on .rudolph .r-body{animation:dance 1.072s ease-in-out infinite}

function call(fn,extra,pw,grade){
  var body={fn:fn,pw:pw==null?CFG.pw:pw,grade:grade||CFG.grade,teacher:CFG.teacher};
  for(var k in extra)body[k]=extra[k];
  // text/plain 본문이라 별도 사전 요청 없이 Apps Script가 받습니다.
  var ctl=window.AbortController?new AbortController():null,timer=ctl&&setTimeout(function(){ctl.abort()},90000);
  return fetch(API_URL,{method:'POST',body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.text()},function(e){
      throw new Error(e&&e.name==='AbortError'?'시트 응답이 90초 넘게 없어요. 잠시 후 「다시 시도」를 눌러 주세요.':'연결 통로에 닿지 못했어요. 인터넷 연결을 확인해 주세요. Apps Script 배포의 액세스가 「모든 사용자」인지도 확인해 주세요.')})
    .then(function(t){
      if(timer)clearTimeout(timer);
      var j;try{j=JSON.parse(t)}catch(e){throw new Error('연결 통로가 오류 화면을 돌려줬어요. Apps Script 코드를 붙여 넣은 뒤 「새 버전」으로 배포했는지 확인해 주세요. ('+String(t).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,120)+')')}
      if(!j.ok)throw new Error(j.error==='알 수 없는 요청입니다.'?'Apps Script를 새 버전으로 다시 배포해야 이 기능을 쓸 수 있어요.':(j.error||'요청을 처리하지 못했어요.'));
      if(fn==='ping'){SV=(j.data&&+j.data.version)||0;lsSet('sc.ver',String(SV));
        if(SV<3)throw new Error('Apps Script에 아주 예전 코드가 배포되어 있어요. 새 코드를 붙여 넣고 「배포 관리 → 수정 → 새 버전」으로 다시 배포해 주세요.')}
      return j.data});
}

function histOf(id){return D.requests.filter(function(r){return r.id===id&&(r.status==='접수완료'||r.status==='취소')})}
function stOf(id){var o=openReq(id);return o?o.status:(histOf(id).some(function(r){return r.status==='접수완료'})?'접수완료':'')}
function findSt(id){for(var i=0;i<D.students.length;i++)if(D.students[i].id===id)return D.students[i];return null}

function reload(){
  D.loading=true;D.err='';render();
  if(!DEMO)Api.check(CFG.pw,CFG.grade).then(function(){if(D.loaded)render()},function(){});
  return Store.load().then(function(d){D.students=d.students;D.requests=d.requests;D.sheet=d.sheet||null;D.loaded=true;D.loading=false;
    if(d.restored&&d.restored.length)toast('시트에서 지운 접수완료 신청 '+d.restored.length+'건: '+d.restored.join(', ')+' 과목을 원래대로 되돌렸어요.');
    if(V.cur){var s=findSt(V.cur.id);V.cur=s;if(s)loadForm(s)}render()})
    .catch(function(e){D.loading=false;D.err=errMsg(e);render()});
}

/* ════════ 화면 골격 ════════ */
var page=$('#page');
function renderNav(){
  var o=D.requests.filter(function(r){return r.status==='작성'||r.status==='처리중'}).length;
  var t=[['students','학생 찾기'],['requests','신청 현황'],['count','과목별 인원'],['settings','설정']];
  $('#nav').innerHTML=t.map(function(x,i){return '<button type="button" role="tab" data-tab="'+x[0]+'" aria-selected="'+(V.tab===x[0])+'"><span class="n">0'+(i+1)+'</span>'+x[1]+(x[0]==='requests'&&o?'<span class="cnt">'+o+'</span>':'')+'</button>'}).join('');
  var ti=0;t.forEach(function(x,i){if(x[0]===V.tab)ti=i});$('#heroIdx').textContent='0'+(ti+1)+' / 04';
  renderDial();
  $$('#nav [data-tab]').forEach(function(b){b.addEventListener('click',function(){V.tab=b.getAttribute('data-tab');V.adm=false;render()})});
  $('#nav').hidden=!CFG.auth;$('#dial').hidden=!CFG.auth;
  $('#conn').innerHTML=!CFG.auth?(DEMO?'<span class="dot demo"></span><span class="small muted">미리보기 데이터 · 저장되지 않아요</span>':'')
    :'<span class="dot '+(DEMO?'demo':D.loaded?'on':'')+'"></span><span class="small"><b style="font-weight:500">'+esc(CFG.teacher)+'</b> 선생님 · '+CFG.grade+'학년 담임교사'+(DEMO?' · 미리보기':'')+'</span>'
      +'<button class="btn ghost small" type="button" id="btnReload">새로고침</button><button class="btn ghost small" type="button" id="btnSwitch">학년 바꾸기</button>';
  var r=$('#btnReload');if(r)r.addEventListener('click',reload);
  var w=$('#btnSwitch');if(w)w.addEventListener('click',function(){lsSet('sc.lastGrade',CFG.grade==='1'?'2':'1');lsSet('sc.grade','');location.reload()});
}
/** 레퍼런스의 반원 시계 자리: 접수 완료 / 전체 신청 */
function renderDial(){
  var all=D.requests.filter(function(r){return r.status!=='취소'}).length,done=D.requests.filter(function(r){return r.status==='접수완료'}).length;
  var f=all?done/all:0,a=Math.PI*(1-f),cx=75,cy=78,R=66,x=cx+R*Math.cos(a),y=cy-R*Math.sin(a);
  $('#dial').innerHTML='<svg viewBox="0 0 150 84" aria-hidden="true"><path d="M9 78 A66 66 0 0 1 141 78" fill="none" stroke="var(--line-2)" stroke-width="1"/>'
    +(f>0?'<path d="M9 78 A66 66 0 0 1 '+x.toFixed(1)+' '+y.toFixed(1)+'" fill="none" stroke="var(--ink)" stroke-width="1.4"/>':'')
    +'<line x1="0" y1="78" x2="150" y2="78" stroke="var(--line-2)" stroke-width="1"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5" fill="var(--ink)"/></svg>'
    +'<span class="lab">서명본 접수 완료</span><span class="val">'+done+' / '+all+'</span>';
}
function render(){
  document.body.classList.toggle('authed',CFG.auth);
  renderNav();
  if(V.tab==='settings')return settingsView();
  if(!CFG.auth)return gateView();
  if(D.err&&!D.loaded){page.innerHTML='<div class="panel"><div class="empty"><b>시트를 불러오지 못했어요</b><span>'+esc(D.err)+'</span><div class="row"><button class="btn primary" type="button" id="retry">다시 시도</button><button class="btn" type="button" id="relogin">다시 들어가기</button></div></div></div>';
    $('#retry').addEventListener('click',reload);$('#relogin').addEventListener('click',function(){lsSet('sc.pw1','');lsSet('sc.pw2','');lsSet('sc.grade','');location.reload()});return}
  if(!D.loaded){page.innerHTML='<div class="panel"><div class="empty"><b>'+CFG.grade+'학년 과목선택 시트를 불러오는 중…</b><span>학생 수가 많으면 몇 초 걸릴 수 있어요.</span></div></div>';return}
  if(V.tab==='students')return studentsView();
  if(V.tab==='requests')return requestsView();
  if(V.tab==='count')return countView();
}

/* ════════ 첫 화면 ════════ */
var G={grade:lsGet('sc.lastGrade','1'),err:'',busy:false,name:lsGet('sc.teacher','')};G.pw=lsGet('sc.pw'+G.grade,'');
function gateView(){
  var card=function(g){var pr=PROFILES[g];return '<button type="button" class="gcard" data-g="'+g+'" aria-pressed="'+(G.grade===g)+'"><span class="gt">'+g+'학년 담임교사</span><span class="gs">'+esc(pr.label)+'</span></button>'};
  page.innerHTML='<section class="gate"><div class="gate-h"><div class="eyebrow">들어가기</div><h2>어느 학년 담임이신가요?</h2></div>'
    +'<div class="gcards">'+card('1')+card('2')+'</div>'
    +'<form class="gform" id="gform" autocomplete="on"><label class="f">선생님 성함<input type="text" id="gName" value="'+esc(G.name)+'" placeholder="예: 김신당" autocomplete="name"></label>'
    +'<label class="f">'+G.grade+'학년 담임교사 비밀번호'+(DEMO?' <span class="muted">(미리보기는 아무 값이나)</span>':'')+'<input type="password" id="gPw" value="'+esc(G.pw)+'" autocomplete="current-password"></label>'
    +(G.err?'<div class="err" role="alert">'+esc(G.err)+'</div>':'')
    +'<button class="btn primary lg" type="submit"'+(G.busy?' disabled':'')+'>'+(G.busy?'확인 중…':G.grade+'학년 담임선생님 입장')+'</button>'
    +'</form></section>';
  var keepIn=function(){G.name=$('#gName').value;G.pw=$('#gPw').value};
  $('#gName').addEventListener('input',keepIn);$('#gPw').addEventListener('input',keepIn);
  $$('.gcard').forEach(function(b){b.addEventListener('click',function(){keepIn();G.grade=b.getAttribute('data-g');G.pw=lsGet('sc.pw'+G.grade,'');G.err='';gateView()})});
  $('#gform').addEventListener('submit',function(e){e.preventDefault();
    keepIn();var nm=G.name.trim(),pw=G.pw;
    if(!nm){G.err='선생님 성함을 입력해 주세요.';return gateView()}
    if(!pw&&!DEMO){G.err=G.grade+'학년 담임교사 비밀번호를 입력해 주세요.';return gateView()}
    G.busy=true;G.err='';gateView();
    (DEMO?Promise.resolve():Api.check(pw,G.grade)).then(function(){
      lsSet('sc.teacher',nm);lsSet('sc.pw'+G.grade,pw);lsSet('sc.grade',G.grade);lsSet('sc.lastGrade',G.grade);location.reload();
    }).catch(function(err){G.busy=false;G.err=errMsg(err);gateView()});
  });
}

/* ════════ 학생 ════════ */
function kpis(){
  var c={작성:0,처리중:0,접수완료:0};D.requests.forEach(function(r){if(c[r.status]!=null)c[r.status]++});
  return verNote()+'<div class="kpis">'
    +'<div class="panel kpi"><div class="k">전체 학생</div><div class="v">'+D.students.length+'</div></div>'
    +'<div class="panel kpi"><div class="k"><span class="st st-작성">작성</span></div><div class="v">'+c['작성']+'</div></div>'
    +'<div class="panel kpi"><div class="k"><span class="st st-처리중">처리중</span><span class="kx">서명 대기</span></div><div class="v">'+c['처리중']+'</div></div>'
    +'<div class="panel kpi"><div class="k"><span class="st st-접수완료">접수완료</span><span class="kx">시트 반영</span></div><div class="v">'+c['접수완료']+'</div></div></div>';
}
function filterRows(){
  var q=V.q.replace(/\s+/g,'').toLowerCase();
  return D.students.filter(function(s){
    if(V.cls&&clsOf(s.id)!==+V.cls)return false;
    if(q&&(s.id+s.name.replace(/\s+/g,'').toLowerCase()).indexOf(q)<0)return false;
    var st=stOf(s.id);
    if(V.filter==='open')return st==='작성'||st==='처리중';
    if(V.filter==='pending')return st==='처리중';
    if(V.filter==='done')return st==='접수완료';
    return true;
  });
}
function listRowsHtml(rows){
  return rows.map(function(s){var st=stOf(s.id);return '<button type="button" class="srow" data-id="'+s.id+'" aria-current="'+(V.cur&&V.cur.id===s.id)+'"><span class="num muted">'+s.id+'</span><span class="nm">'+esc(s.name)+'</span>'+(st?'<span class="st st-'+st+'">'+st+'</span>':'<span></span>')+'</button>'}).join('')
    +(rows.length?'':'<div class="empty small">조건에 맞는 학생이 없어요.</div>');
}
function bindRows(){$$('.srow').forEach(function(b){b.addEventListener('click',function(){select(findSt(b.getAttribute('data-id')))})})}
/** 검색어가 바뀔 때는 목록만 다시 그립니다(입력칸을 새로 만들면 한글 조합이 끊깁니다). */
function refreshList(){
  var rows=filterRows();$('#slist').innerHTML=listRowsHtml(rows);$('#listFoot').textContent=rows.length+'명 표시 · 시트 행 순서와 관계없이 학번순';bindRows();
}
function studentsView(){
  var classes={};D.students.forEach(function(s){classes[clsOf(s.id)]=1});
  var rows=filterRows();
  var h=kpis()+'<div class="work'+(V.cur?' has-cur':'')+'"><section class="panel listp" aria-label="학생 목록"><div class="list-tools">'
    +'<div class="row" style="flex-wrap:nowrap"><select id="cls" style="width:130px;flex:none" aria-label="반"><option value="">전체 반</option>'+Object.keys(classes).sort(function(a,b){return a-b}).map(function(c){return '<option value="'+c+'"'+(String(V.cls)===c?' selected':'')+'>'+CFG.grade+'학년 '+c+'반</option>'}).join('')+'</select>'
    +'<input type="search" id="q" placeholder="이름 (또는 학번)" value="'+esc(V.q)+'" aria-label="이름으로 찾기"></div>'
    +'<div class="chips" role="group" aria-label="상태 거르기">'+[['all','전체'],['open','신청 중'],['pending','처리중'],['done','접수완료']].map(function(x){return '<button type="button" data-f="'+x[0]+'" aria-pressed="'+(V.filter===x[0])+'">'+x[1]+'</button>'}).join('')+'</div></div>'
    +'<div class="slist" id="slist">'+listRowsHtml(rows)+'</div>'
    +'<div class="list-foot" id="listFoot">'+rows.length+'명 표시 · 시트 행 순서와 관계없이 학번순</div></section>'
    +'<section class="panel" aria-label="변경 작업" id="detail">'+detailHtml()+'</section></div>';
  page.innerHTML=h;
  var qi=$('#q');
  qi.addEventListener('keydown',function(e){if(e.key!=='Enter')return;e.preventDefault();V.q=qi.value;var r=filterRows();if(r.length)select(r[0])});
  qi.addEventListener('input',function(){V.q=qi.value;refreshList()});
  $('#cls').addEventListener('change',function(e){V.cls=e.target.value;studentsView()});
  $$('[data-f]').forEach(function(b){b.addEventListener('click',function(){V.filter=b.getAttribute('data-f');studentsView()})});
  bindRows();
  bindDetail();
}
function select(s){V.cur=s;V.confirm=false;V.edit=false;V.msg='';loadForm(s);studentsView();if(window.innerWidth<900)window.scrollTo(0,$('#detail').getBoundingClientRect().top+window.scrollY-12)}
/** 시트 정보로 과학중점·체육특성화 기본값을 정합니다. */
function hasTag(s,tag){
  return [1,2].some(function(sem){return (sem===1?s.raw1:s.raw2).some(function(x){var i=subjInfo(sem,x);return i&&i[2]===tag})});
}
function defaultsOf(s){
  var v=String(s.science||'').trim(),sci;
  if(/^(예|네|o|y|yes|희망|○)$/i.test(v))sci='O';
  else if(/^(아니오|아니요|x|n|no|미희망|×)$/i.test(v))sci='X';
  else sci=hasTag(s,'sci')&&!P.sciCol?'O':(P.sciCol?'':'X');
  return {science:sci,pe:hasTag(s,'pe')?'O':'X',
    sciWhy:P.sciCol?(v?'시트 과학중점 「'+v+'」':'시트에 과학중점 값 없음'):(sci==='O'?'과학 진로(*) 과목 이수 중':'과학 진로(*) 과목 없음'),
    peWhy:hasTag(s,'pe')?'체육 전공실기 이수 중':'체육 전공실기 없음'};
}
function loadForm(s){
  var o=openReq(s.id),d=defaultsOf(s);
  V.form=o?JSON.parse(JSON.stringify(o)):{no:'',id:s.id,name:s.name,status:'',changes:[{sem:'',from:'',to:''}],reason:'',science:d.science,pe:d.pe,date:todayStr(),createdAt:'',printedAt:'',doneAt:'',before:null,after:null,logRow:0};
  if(!V.form.changes.length)V.form.changes=[{sem:'',from:'',to:''}];
}
function afterOf(s,changes){
  var a={sem1:s.raw1.slice(),sem2:s.raw2.slice()};
  changes.forEach(function(c){if(!(c.sem&&c.from&&c.to))return;var l=c.sem==1?a.sem1:a.sem2;for(var i=0;i<l.length;i++)if(norm(l[i])===norm(c.from)){l[i]=c.to;break}});
  return a;
}
function detailHtml(){
  var s=V.cur;
  if(!s)return '<div class="empty"><b>왼쪽에서 학생을 고르세요</b><span>변경을 요청한 학생을 찾아 기존 과목을 확인하고,<br>변경 내용을 적어 확인서·신청서를 인쇄합니다.</span></div>';
  var f=V.form,st=f.status,locked=st==='처리중'&&!V.edit,shown=st||stOf(s.id);
  var flow=['작성','처리중','접수완료'],idx=flow.indexOf(shown);
  var h='<div class="panel-b"><button class="btn ghost mback" type="button" id="mback">← 학생 목록</button><div class="who"><h2>'+esc(s.name)+'</h2><span class="meta num">'+s.id+'</span><span class="meta">'+CFG.grade+'학년 '+clsOf(s.id)+'반 '+noOf(s.id)+'번 · 시트 '+s.row+'행'+(s.science?' · 과학중점(DB) '+esc(s.science):'')+'</span>'
    +'<span class="spacer"></span>'+(shown?'<span class="st st-'+shown+'">'+shown+'</span>':'<span class="st st-none">신청 없음</span>')+'</div>'
    +'<div class="flow" aria-label="진행 단계">'
    +'<div class="'+(idx===0?'on':idx>0?'ok':'')+'"><b>1 작성</b><span>'+(f.createdBy?esc(f.createdBy)+' 선생님 · '+esc(f.createdAt):'변경 내용 입력·저장')+'</span></div>'
    +'<div class="'+(idx===1?'on':idx>1?'ok':'')+'"><b>2 처리중</b><span>'+(f.printedAt?(f.printedBy?esc(f.printedBy)+' 선생님 · ':'')+esc(f.printedAt)+' 출력':'인쇄 후 서명 대기')+'</span></div>'
    +'<div class="'+(idx===2?'ok':'')+'"><b>3 접수완료</b><span>'+(function(){var h=histOf(s.id).filter(function(r){return r.status==='접수완료'});var l=h[h.length-1];return idx===2&&l?(l.doneBy?esc(l.doneBy)+' 선생님 · ':'')+esc(l.doneAt):'서명본 회수 → 시트 반영'})()+'</span></div></div>';
  if(V.msg)h+='<div class="info">'+V.msg+'</div>';
  h+='<div><div class="eyebrow" style="margin-bottom:8px">현재 시트의 '+P.course+'학년 신청 과목</div>'+semView(s.raw1,s.raw2,locked||!st&&!f.changes.some(function(c){return c.to})?[]:f.changes,true)+'</div>';
  if(locked){
    h+='<div><div class="eyebrow" style="margin-bottom:8px">출력한 변경 내용</div><div class="info pre">'+esc(summary(f))+(f.reason?'\n사유: '+esc(f.reason):'')+'</div></div>';
  }else{
    var dft=defaultsOf(s);
    h+='<div class="fields">'+ox('science','과학중점 희망',f.science,dft.sciWhy)+ox('pe','체육특성화 희망',f.pe,dft.peWhy)
      +'<label class="f">신청일 (양식 날짜)<input type="date" id="fDate" value="'+esc(f.date)+'"></label></div>'
      +'<div><div class="eyebrow" style="margin-bottom:8px">변경 신청 과목 · 최대 '+MAX_CHANGES+'건</div><div class="stack" id="chg" style="display:flex;flex-direction:column;gap:8px">'+f.changes.map(chgRow).join('')+'</div>'
      +'<button class="btn ghost" type="button" id="addChg" style="margin-top:6px"'+(f.changes.length>=MAX_CHANGES?' disabled':'')+'>+ 변경 과목 추가</button></div>'
      +'<label class="f">변경 사유 <span class="muted" style="font-weight:400">비워 두면 양식에 빈칸으로 인쇄되어 학생이 직접 씁니다</span><textarea id="reason">'+esc(f.reason)+'</textarea></label>';
  }
  var hist=histOf(s.id);
  var lastDone=null;hist.forEach(function(r){if(r.status==='접수완료')lastDone=r});
  if(hist.length)h+='<div><div class="eyebrow" style="margin-bottom:8px">지난 처리</div><div class="hist">'+hist.map(function(r){return '<div><span class="st st-'+r.status+'">'+r.status+'</span><span class="num">'+esc(r.doneAt||r.printedAt||r.createdAt)+'</span><span>'+esc(r.doneBy?r.doneBy+' 선생님':'')+'</span><span class="pre">'+esc(summary(r).replace(/\n/g,' · '))+'</span>'
    +(r===lastDone&&!st?'<button class="btn ghost small" type="button" id="revertBtn">↶ 접수 되돌리기</button><button class="btn danger small" type="button" id="delDone">삭제(원래 과목으로)</button>':'')+'</div>'}).join('')+'</div>'
    +(lastDone&&!st?'<p class="small muted" id="revertNote" style="margin-top:6px">접수 되돌리기: 시트 과목을 바뀌기 전으로 복구하고 「처리중」으로 돌립니다.<br>삭제(원래 과목으로): 시트 과목을 바뀌기 전으로 복구하고 이 신청 기록을 지웁니다.</p>':'')+'</div>';
  if(V.confirm){
    var a=afterOf(s,f.changes);
    h+='<div class="confirm" role="alertdialog" aria-label="시트 반영 확인"><b>보호자 서명본을 받으셨나요? 아래 내용이 시트에 바로 반영됩니다.</b><ul>'
      +f.changes.map(function(c){return '<li>'+c.sem+'학기 <b>'+esc(c.from)+'</b> → <b>'+esc(c.to)+'</b></li>'}).join('')+'</ul>'
      +'<span class="small muted">「'+esc(CFG.dbSheet)+'」 '+s.row+'행의 B~'+LAST+'열이 바뀌고, 「'+LOG_SHEET+'」 탭에 기존 과목과 접수 선생님('+esc(CFG.teacher)+')이 함께 기록됩니다.</span>'

  f.changes=ch;f.status=status;f.id=s.id;f.name=s.name;

    var i=D.requests.findIndex(function(x){return x.logRow===r.logRow});var c=JSON.parse(JSON.stringify(r));

/* 설정 잠금: 비밀번호 원문 대신 솔트를 넣어 20만 번 돌린 PBKDF2 값만 둡니다. */
var ADMIN_HASH='3237941038670209ed47ad77b507ddca9e022bbdc61e38055725fad3b4683e62',ADMIN_SALT='sindang-settings-v1';
function adminOk(){return V.adm===true} // 설정 탭에 들어올 때마다 다시 묻습니다
function checkAdmin(pw){
  if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error('이 브라우저에서는 설정을 열 수 없어요.'));
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(ADMIN_SALT),iterations:200000,hash:'SHA-256'},k,256)
  }).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')===ADMIN_HASH});
}

    +'<div id="admErr"></div><div class="row"><button class="btn primary" type="submit">설정 열기</button></div></form></section>';

var SV_STATE={tab:'gs',gsTab:'db',cls:'',q:''};
function changedCells(){
  var m={};
  D.requests.forEach(function(r){
    if(r.status!=='접수완료'||!r.after||!r.before)return;
    var k=m[r.id]=m[r.id]||{};
    [1,2].forEach(function(sem){var b=r.before['sem'+sem]||[],a=r.after['sem'+sem]||[];a.forEach(function(x,i){if(norm(x)!==norm(b[i]||''))k[sem+'-'+i]=b[i]||''})});
  });
  return m;
}
function sheetRowsDb(){
  var q=SV_STATE.q.replace(/\s+/g,'').toLowerCase();
  return D.students.slice().sort(function(a,b){return a.row-b.row}).filter(function(s){
    if(SV_STATE.cls&&clsOf(s.id)!==+SV_STATE.cls)return false;
    return !q||(s.id+s.name.replace(/\s+/g,'').toLowerCase()).indexOf(q)>=0;
  });
}
function sheetRowsLog(){
  var q=SV_STATE.q.replace(/\s+/g,'').toLowerCase();
  return D.requests.slice().sort(function(a,b){return a.logRow-b.logRow}).filter(function(r){
    if(SV_STATE.cls&&clsOf(r.id)!==+SV_STATE.cls)return false;
    return !q||(r.id+String(r.name).replace(/\s+/g,'').toLowerCase()).indexOf(q)>=0;
  });
}

var Synth=(function(){ // 유튜브를 쓸 수 없을 때 대신 나오는 징글벨 재즈
  var ac=null,out=null,dry=null,wet=null,on=false,timer=null,loopStart=0,loopN=0,noiseBuf=null;
  var BPM=112,B=60/BPM,BAR=4*B;
  function hz(m){return 440*Math.pow(2,(m-69)/12)}
  function sw(pos){var f=pos-Math.floor(pos);return Math.abs(f-0.5)<1e-6?pos+1/6:pos} // 스윙: 뒷박을 3연음 뒤로
  // 멜로디(C장조) [음, 박]
  var A1=[[76,1],[76,1],[76,2],[76,1],[76,1],[76,2],[76,1],[79,1],[72,1.5],[74,.5],[76,4]];
  var MEL=A1.concat([[77,1],[77,1],[77,1.5],[77,.5],[77,1],[76,1],[76,1],[76,.5],[76,.5],[76,1],[74,1],[74,1],[76,1],[74,2],[79,2]])
    .concat(A1).concat([[77,1],[77,1],[77,1],[77,1],[77,1],[76,1],[76,1],[76,.5],[76,.5],[79,1],[79,1],[77,1],[74,1],[72,4]]);
  // 마디별 화음(반 마디씩)
  var Q={M7:[4,11,14],D7:[4,10,14],m7:[3,10,14],'6':[4,9,14],o7:[3,6,9]};
  function c(root,q){return {r:root,q:q}}
  var C6=c(36,'6'),CM=c(36,'M7'),A7=c(45,'D7'),Dm=c(38,'m7'),G7=c(43,'D7'),FM=c(41,'M7'),D7=c(38,'D7'),Fo=c(42,'o7');
  var CH=[[C6,C6],[CM,A7],[Dm,G7],[CM,A7],[FM,FM],[C6,A7],[D7,D7],[Dm,G7],
          [C6,C6],[CM,A7],[Dm,G7],[CM,A7],[FM,Fo],[C6,A7],[Dm,G7],[C6,G7]];
  var LOOP=CH.length*BAR;

  function env(g,t,peak,att,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec)}
  function vib(t,m,vol,dur){ // 비브라폰: 사인 + 떨림
    var g=ac.createGain(),trem=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain();
    lfo.frequency.value=5.2;lg.gain.value=0.35;lfo.connect(lg);lg.connect(trem.gain);trem.gain.value=0.75;
    g.connect(trem);trem.connect(dry);trem.connect(wet);env(g,t,vol,0.006,dur);
    [[1,1],[4,.12],[10,.02]].forEach(function(p){var o=ac.createOscillator(),pg=ac.createGain();o.type='sine';o.frequency.value=hz(m)*p[0];pg.gain.value=p[1];o.connect(pg);pg.connect(g);o.start(t);o.stop(t+dur+.1)});
    lfo.start(t);lfo.stop(t+dur+.1);
  }
  function rhodes(t,m,vol,dur){ // 로즈 피아노
    var g=ac.createGain();g.connect(dry);g.connect(wet);env(g,t,vol,0.01,dur);
    [[1,1,'sine'],[2,.18,'sine'],[1,.12,'triangle']].forEach(function(p){var o=ac.createOscillator(),pg=ac.createGain();o.type=p[2];o.frequency.value=hz(m)*p[0];o.detune.value=p[2]==='triangle'?6:0;pg.gain.value=p[1];o.connect(pg);pg.connect(g);o.start(t);o.stop(t+dur+.1)});
  }
  function bass(t,m,vol){ // 콘트라베이스 느낌
    var g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;g.connect(lp);lp.connect(dry);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(vol*0.35,t+0.18);g.gain.exponentialRampToValueAtTime(0.0001,t+B*0.95);
    var o=ac.createOscillator();o.type='triangle';o.frequency.value=hz(m);o.connect(g);o.start(t);o.stop(t+B);
  }
  function noise(t,vol,dur,type,freq,q){
    var s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q||0.7;
    s.connect(f);f.connect(g);g.connect(dry);g.connect(wet);env(g,t,vol,0.004,dur);s.start(t,Math.random()*0.5);s.stop(t+dur+.05);
  }
  function brushRide(t,acc){noise(t,acc?0.05:0.03,acc?0.22:0.12,'bandpass',7200,0.9)}
  function snareBrush(t){noise(t,0.035,0.28,'bandpass',2600,0.6)}
  function sleigh(t){noise(t,0.022,0.18,'highpass',9000,0.5);noise(t+0.06,0.015,0.12,'highpass',10500,0.5)}

  function schedule(t0,n){
    // 멜로디 (두 번째 바퀴부터는 한 옥타브 위 장식음 조금)
    var pos=0;MEL.forEach(function(x){if(x[0]!=null)vib(t0+sw(pos)*B,x[0]+(n%2?12:0)*0,0.14,Math.min(2.2,x[1]*B+0.9));pos+=x[1]});
    CH.forEach(function(bar,i){
      var bt=t0+i*BAR;
      bar.forEach(function(ch,h){
        var ht=bt+h*2*B,next=(h===0?bar[1]:(CH[i+1]||CH[0])[0]);
        // 로즈 화음: 2박과 4박 뒤쪽(스윙)에 콤핑
        var notes=Q[ch.q].map(function(iv){var m=ch.r+24+iv;while(m>71)m-=12;while(m<55)m+=12;return m});
        var hit=ht+(h===0?sw(1.5):sw(0.5))*B;
        notes.forEach(function(m){rhodes(hit,m,0.045,1.3)});
        // 워킹 베이스: 근음 → 다음 화음으로 반음 접근
        var appr=next.r===ch.r?ch.r+7:next.r-1;while(appr>47)appr-=12;while(appr<33)appr+=12;
        bass(ht,ch.r,0.32);bass(ht+B,appr,0.26);
      });
      // 브러시 드럼: 라이드 스윙 + 2·4박 스네어 브러시, 썰매 방울
      [0,1,1+2/3,2,3,3+2/3].forEach(function(p){brushRide(bt+p*B,p===1||p===3)});
      snareBrush(bt+B);snareBrush(bt+3*B);
      if(i%2===1)[0,1,2,3].forEach(function(p){sleigh(bt+p*B)});
    });
  }
  function loop(){
    if(!on)return;
    schedule(loopStart,loopN++);loopStart+=LOOP;
    timer=setTimeout(loop,Math.max(200,(loopStart-ac.currentTime-2)*1000));
  }
  function ensure(){
    if(ac)return true;
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
    ac=new C();
    out=ac.createGain();out.gain.value=0.0001;out.connect(ac.destination);
    dry=ac.createGain();dry.gain.value=0.9;dry.connect(out);
    // 리버브(짧게 감쇠하는 잡음으로 만든 공간)
    var len=Math.floor(ac.sampleRate*2.4),ir=ac.createBuffer(2,len,ac.sampleRate);
    for(var ch=0;ch<2;ch++){var d=ir.getChannelData(ch);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    var conv=ac.createConvolver();conv.buffer=ir;wet=ac.createGain();wet.gain.value=0.32;wet.connect(conv);conv.connect(out);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);var nd=noiseBuf.getChannelData(0);for(var k=0;k<nd.length;k++)nd[k]=Math.random()*2-1;
    return true;
  }
  function start(){
    if(!ensure())return Promise.resolve(false);
    return ac.resume().then(function(){
      if(ac.state!=='running')return false;
      if(!on){on=true;var t=ac.currentTime;out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(0.0001,t);out.gain.exponentialRampToValueAtTime(0.5,t+1.5);
        loopStart=t+0.2;loopN=0;loop()}
      return true;
    }).catch(function(){return false});
  }
  function stop(){
    on=false;clearTimeout(timer);
    if(ac){var t=ac.currentTime;out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(Math.max(out.gain.value,0.0002),t);out.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      setTimeout(function(){if(!on&&ac)ac.suspend()},600)}
  }
  return {start:start,stop:stop,playing:function(){return on}};
})();

/* ════════ 배경 음악: 유튜브 노래 (공식 플레이어) ════════
   재생 중에는 오른쪽 아래에 작은 플레이어가 보입니다(유튜브 이용 규칙). 영상을 쓸 수 없으면 징글벨 재즈로 대신합니다. */
var YT_VIDEO='Bpd0uiAkbBU';
var Music=(function(){
  var player=null,ready=false,on=false,useSynth=false,want=false,box=null,api={onchange:null};
  function notify(){if(api.onchange)api.onchange()}
  function toSynth(){useSynth=true;if(box)box.hidden=true;if(want)Synth.start().then(function(){on=Synth.playing();notify()})}
  function mount(){
    box=document.createElement('div');box.className='yt-box';box.hidden=true;box.innerHTML='<div id="ytPlayer"></div>';document.body.appendChild(box);
    window.onYouTubeIframeAPIReady=function(){
      player=new YT.Player('ytPlayer',{width:200,height:113,videoId:YT_VIDEO,
        playerVars:{autoplay:0,controls:1,loop:1,playlist:YT_VIDEO,playsinline:1,rel:0,modestbranding:1},
        events:{
          onReady:function(){ready=true;if(want)play()},
          onError:function(){toSynth()},
          onStateChange:function(e){on=(e.data===1||e.data===3);if(e.data===1)box.hidden=false;notify()}
        }});
    };
    var sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.onerror=toSynth;document.head.appendChild(sc);
    setTimeout(function(){if(!ready&&!useSynth)toSynth()},10000); // 학교망에서 유튜브가 막힌 경우
  }
  function play(){
    want=true;
    if(useSynth)return Synth.start().then(function(ok){on=ok;notify();return ok});
    if(!ready)return Promise.resolve(false);
    box.hidden=false;try{player.unMute();player.setVolume(55);player.playVideo()}catch(e){toSynth()}
    return Promise.resolve(true);
  }
  function stop(){
    want=false;on=false;
    if(useSynth)Synth.stop();else if(ready){try{player.pauseVideo()}catch(e){}}
    if(box)box.hidden=true;notify();
  }
  mount();
  api.start=play;api.stop=stop;api.playing=function(){return useSynth?Synth.playing():(on||want&&!ready)};
  return api;
})();
(function(){
  var btn=document.createElement('button');btn.type='button';btn.className='music-btn';document.body.appendChild(btn);
  function paint(){var p=Music.playing();document.body.classList.toggle('music-on',p);btn.setAttribute('aria-pressed',p);btn.setAttribute('aria-label',p?'음악 끄기':'음악 켜기');btn.title=p?'크리스마스 재즈 끄기':'크리스마스 재즈 켜기';
    btn.innerHTML='<span aria-hidden="true">♪</span>'+(p?'<i></i><i></i><i></i>':'<small>음악</small>')}
  paint();Music.onchange=paint;
  btn.addEventListener('click',function(e){e.stopPropagation();
    if(Music.playing()){Music.stop();lsSet('sc.music','off');paint()}
    else{lsSet('sc.music','on');Music.start().then(paint)}});
  if(lsGet('sc.music','on')==='off')return;
  // 열자마자 시도하고(허용된 브라우저), 막히면 첫 클릭·입력 때 시작
  Music.start().then(function(ok){paint();if(ok)return;
    var evs=['pointerdown','keydown','touchstart'];
    var go=function(){Music.start().then(function(r){paint();if(r)evs.forEach(function(ev){document.removeEventListener(ev,go,true)})})};
    evs.forEach(function(ev){document.addEventListener(ev,go,true)});
  });
})();
