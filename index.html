<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선택과목 변경 신청</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 1학년 과목선택 시스템과 같은 분홍 배경 위 둥근 카드 한 장. 밝은 파스텔 한 가지 테마로 고정 */
:root{
  color-scheme:light;
  --bg:#fff0f3; --card:#ffffff; --card-line:#ffb7bf;
  --title:#ff7676; --tag:#c48a8a; --ink:#4a3b3b; --label:#7a5a4e; --muted:#9a8a86;
  --field:#fcfdf7; --field-line:#e2edcf; --field-focus:#b9d98f;
  --mint:#dcf5f3; --mint-line:#9edbd5; --mint-ink:#2f7f78;
  --peach:#ffdcc8; --peach-line:#ffbf9c; --peach-ink:#d0623f;
  --alert:#ffe2e2; --alert-line:#f28b8b; --alert-ink:#c0392b;
  --info:#e2f3fd; --info-line:#86c8ee; --info-ink:#2a6f98;
  --note:#ffe9ec; --note-line:#ffc3ca; --note-ink:#c2546a;
  --tab:#f3f3f3; --tab-line:#e3e3e3;
  --ok:#3f9d6b; --ok-weak:#e3f5ea; --warn:#c07a12; --warn-weak:#fff3dc; --bad:#d64545; --bad-weak:#ffe3e3;
  --paper:#ffffff; --paper-ink:#111111;
  --f-round:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-round);font-size:15px;line-height:1.6;margin:0;
  word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-round);font-weight:400;margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
b,strong{font-weight:400;color:var(--title)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

/* 미리보기 띠 */
.demo{max-width:480px;margin:0 auto 12px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;padding:8px 12px;
  border:2px dashed var(--peach-line);border-radius:16px;background:#fffaf5;font-size:.82rem;text-align:center;color:var(--label)}
.demo b{color:var(--peach-ink)}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid var(--tab-line);background:var(--card)}
.seg button{border:0;background:transparent;padding:4px 12px;font:inherit;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--peach);color:var(--peach-ink)}

/* 카드 */
.shell{max-width:480px;margin:0 auto;background:var(--card);border:3px solid var(--card-line);border-radius:28px;
  padding:18px 18px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 0 #ffd9de}
.shell.wide{max-width:1000px}
.masthead{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.topbtns{display:flex;justify-content:space-between;width:100%;gap:8px}
.chip{font:inherit;font-size:.84rem;border-radius:14px;padding:7px 12px;cursor:pointer;border:2px solid;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.chip.mint{background:var(--mint);border-color:var(--mint-line);color:var(--mint-ink)}
.chip.peach{background:var(--peach);border-color:var(--peach-line);color:var(--peach-ink)}
.chip:active{transform:translateY(2px);box-shadow:none}
.title{font-size:1.65rem;color:var(--title);letter-spacing:-.01em}
.title span{white-space:nowrap}
.tagline{font-size:.9rem;color:var(--tag)}

/* 안내 상자 (점선) */
.box{border:2px dashed;border-radius:18px;padding:12px 14px;text-align:center;font-size:.9rem;line-height:1.7}
.box.alert{background:var(--alert);border-color:var(--alert-line);color:var(--alert-ink)}
.box.alert b{color:var(--alert-ink)}
.box.info{background:var(--info);border-color:var(--info-line);color:var(--info-ink)}
.box.info b{color:var(--info-ink)}
.box.note{background:var(--note);border-color:var(--note-line);color:var(--note-ink)}
.box.note b{color:var(--note-ink)}
.box.note .head{display:block;margin-bottom:2px}
.box.plain{background:#fffdf8;border-color:var(--field-line);color:var(--ink);text-align:left}
#notices{display:flex;flex-direction:column;gap:12px}
#notices:empty{display:none}

/* 본문 구획 */
#app{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2,.lbl{font-size:1.05rem;color:var(--label)}
.card h3{font-size:.98rem;color:var(--label)}
.stack{display:flex;flex-direction:column;gap:10px}
.lbl{display:flex;align-items:center;gap:6px}
.hint{text-align:center;font-size:.84rem;color:var(--muted)}

/* 입력칸 */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.95rem;color:var(--label)}
input[type=text],input[type=password],input[type=date],select,textarea{font-family:var(--f-round);font-size:1rem;color:var(--ink);
  background:var(--field);border:2px solid var(--field-line);border-radius:16px;padding:11px 14px;width:100%;min-width:0;outline:none}
input::placeholder,textarea::placeholder{color:#a89d97}
input:disabled{color:#b5aca8;background:#f6f6f2}
input:focus,select:focus,textarea:focus{border-color:var(--field-focus);background:#fff}
input.center{text-align:center;letter-spacing:.08em}
textarea{min-height:130px;resize:vertical;font-family:var(--f-body);line-height:1.7}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#b09a90 50%),linear-gradient(135deg,#b09a90 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 12px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
.idrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.idrow input{text-align:center;padding:11px 6px}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--field-focus);outline-offset:2px}

/* 버튼 */
.btn{font-family:var(--f-round);font-size:1rem;border-radius:16px;padding:11px 18px;border:2px solid var(--tab-line);background:var(--tab);color:var(--label);
  cursor:pointer;box-shadow:0 4px 0 var(--tab-line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tab-line)}
.btn.primary{background:var(--peach);border-color:var(--peach-line);color:var(--peach-ink);box-shadow:0 4px 0 var(--peach-line)}
.btn.primary:active{box-shadow:0 1px 0 var(--peach-line)}
.btn.big{width:100%;padding:14px;font-size:1.08rem}
.btn.danger{background:var(--bad-weak);border-color:#f5b5b5;color:var(--bad);box-shadow:0 4px 0 #f5b5b5}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--note-ink);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.err{color:var(--alert-ink);background:var(--alert);border:2px dashed var(--alert-line);border-radius:16px;padding:10px 12px;font-size:.92rem;text-align:center}
.note{background:var(--note);border:2px dashed var(--note-line);border-radius:16px;padding:10px 14px;font-size:.92rem;color:var(--ink)}
.note b{color:var(--note-ink)}

ol.steps-guide{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;text-align:left;font-family:var(--f-body)}
ol.steps-guide li::marker{color:var(--title)}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;text-align:left;font-family:var(--f-body)}

/* 단계 탭 (1학기/2학기 탭 모양) */
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stepper div{font-size:.8rem;text-align:center;padding:8px 2px 7px;border-radius:14px;background:var(--tab);border:2px solid var(--tab-line);color:#b0a7a3;line-height:1.3}
.stepper div span{display:block;font-size:.72rem}
.stepper div.on{background:var(--peach);border-color:var(--peach-line);color:var(--peach-ink);box-shadow:0 4px 0 var(--peach-line)}
.stepper div.done{background:var(--ok-weak);border-color:#bfe3cc;color:var(--ok)}

.who{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;background:#fffdf8;border:2px solid var(--field-line);border-radius:16px;padding:8px 12px}
.who b{color:var(--label);font-size:1.05rem}

/* 학기별 과목 */
.semcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shell:not(.wide) .semcols{grid-template-columns:1fr}
.sem{border:2px solid var(--field-line);border-radius:16px;overflow:hidden;background:var(--field)}
.sem h3{background:#f3f8ea;padding:7px 12px;font-size:.92rem;color:var(--label)}
.sem ol{margin:0;padding:6px 12px 8px 2.2em}
.sem li{padding:2px 0}
.sem li.out,.sem .out{color:var(--muted);text-decoration:line-through}
.sem .in{color:var(--ok)}
.sem .arrow{color:var(--muted);margin:0 4px}

/* 확인서 문항 */
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;margin-bottom:8px;
  background:#fffdf8;border:2px solid var(--field-line);border-radius:16px}
.q > span{font-family:var(--f-body);font-size:.92rem}
@media (max-width:420px){.q{grid-template-columns:1fr}.q .yn{justify-self:end}}
.yn{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid var(--tab-line);background:var(--tab)}
.yn label{padding:5px 13px;cursor:pointer;font-size:.92rem;color:#a39894;white-space:nowrap}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn label:has(input:checked){background:var(--peach);color:var(--peach-ink)}
.yn label.no:has(input:checked){background:var(--alert);color:var(--alert-ink)}
.yn label:has(input:focus-visible){outline:3px solid var(--field-focus);outline-offset:-3px}

/* 변경 과목 줄 */
.chg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border:2px solid var(--field-line);border-radius:16px;background:#fffdf8}
.chg select.sem{grid-column:1 / -1;background-color:#f3f8ea}
.chg .arr{display:none}
.chg [data-del]{grid-column:1 / -1;justify-self:end}
.shell.wide .chg{grid-template-columns:96px minmax(0,1fr) 22px minmax(0,1fr) auto}
.shell.wide .chg select.sem,.shell.wide .chg [data-del]{grid-column:auto}
.shell.wide .chg .arr{display:block;text-align:center;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;padding:0 7px;border-radius:8px;background:var(--mint);color:var(--mint-ink);vertical-align:1px}

/* 서명 */
.sigs{display:grid;grid-template-columns:1fr;gap:12px}
.sig{display:flex;flex-direction:column;gap:6px;color:var(--label)}
.sig canvas{width:100%;height:150px;background:var(--paper);border:2px dashed var(--card-line);border-radius:16px;touch-action:none;cursor:crosshair}

.pill{display:inline-block;font-size:.8rem;padding:1px 10px;border-radius:999px;white-space:nowrap;border:2px solid transparent}
.st-접수{background:var(--info);color:var(--info-ink);border-color:var(--info-line)}
.st-상담중{background:var(--warn-weak);color:var(--warn);border-color:#f1cf8e}
.st-승인{background:var(--ok-weak);color:var(--ok);border-color:#bfe3cc}
.st-반려{background:var(--bad-weak);color:var(--bad);border-color:#f5b5b5}

/* 과목 안내 패널 */
#guidePanel{display:flex;flex-direction:column;gap:12px}
#guidePanel[hidden]{display:none}
.subj-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.subj-list{grid-template-columns:1fr}}
.subj-list ul{margin:0;padding:6px 12px 8px 1.4em;font-family:var(--f-body);font-size:.9rem}

/* 교사 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{font:inherit;border-radius:14px;padding:8px 14px;background:var(--tab);border:2px solid var(--tab-line);color:#a39894;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--peach);border-color:var(--peach-line);color:var(--peach-ink);box-shadow:0 4px 0 var(--peach-line)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:640px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{border:2px solid var(--field-line);border-radius:16px;padding:8px 12px;background:var(--field);text-align:center}
.stat .k{font-size:.82rem;color:var(--muted)}
.stat .v{font-size:1.6rem;color:var(--label);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:2px solid var(--field-line);border-radius:16px;background:var(--card)}
table.t{border-collapse:collapse;width:100%;font-size:.9rem}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid #eef3e3;text-align:left;vertical-align:top}
table.t th{background:#f3f8ea;white-space:nowrap;font-size:.84rem;color:var(--label);font-weight:400}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:#fff6f7}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.delta-up{color:var(--ok)}.delta-dn{color:var(--bad)}
.summary-cell{white-space:pre-line;min-width:220px;font-family:var(--f-body)}
.drawer-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

/* 출력용 양식: 공문 서식 그대로 */
.paper-wrap{overflow-x:auto}
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:720px;margin:0 auto;padding:28px 30px;border:1px solid #ddd;border-radius:6px;
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:13px;line-height:1.5;word-break:keep-all}
.paper b{color:inherit;font-weight:700}
.paper h2{text-align:center;font-family:inherit;font-weight:700;font-size:20px;letter-spacing:.3em;margin:4px 0 14px;color:var(--paper-ink)}
.paper .formno{font-size:12px;color:#444}
.paper table{border-collapse:collapse;width:100%;color:var(--paper-ink)}
.paper td,.paper th{border:1px solid #333;padding:6px 8px;vertical-align:middle}
.paper th{background:#eef1f5;font-weight:600}
.paper .ck{width:110px;text-align:center;white-space:nowrap}
.paper .sigline{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:4px}
.paper .sigline img{height:46px;width:auto;max-width:160px}
.paper .foot{text-align:center;font-weight:700;font-size:16px;margin-top:14px;letter-spacing:.1em}
.paper .gap{height:22px}
.paper .page-break{break-before:page}
.paper-doc + .paper-doc{break-before:page}
#printArea[hidden]{display:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--label);color:#fff;
  padding:10px 18px;border-radius:16px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
.loading{opacity:.6;pointer-events:none}

@media print{
  html,body{background:#fff;padding:0}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .paper{border:0;max-width:none;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>

<div class="demo" id="demoBar" hidden>
  <b>미리보기</b><span>아직 학생 시트와 연결되지 않아 예시 데이터로만 동작합니다. 저장되지 않습니다.</span>
  <div class="seg" role="group" aria-label="화면 전환">
    <button type="button" id="demoStudent" aria-pressed="true">학생 화면</button>
    <button type="button" id="demoTeacher" aria-pressed="false">교사 화면</button>
  </div>
  <span class="muted" id="demoHint"></span>
</div>

<div class="shell" id="shell">
  <header class="masthead">
    <div class="topbtns">
      <button type="button" class="chip mint" id="btnGuide">📖 과목 안내 보기</button>
      <button type="button" class="chip peach" id="btnLookup">🔍 내역조회/수정</button>
    </div>
    <h1 class="title" id="pageTitle"><span>🏫 천안신당고등학교</span><br><span>선택과목 변경 신청 🐥</span></h1>
    <p class="tagline" id="tagline">진로를 위한 한 걸음, 신중하게 바꿔 봐요!</p>
  </header>
  <div id="notices"></div>
  <div id="guidePanel" hidden></div>
  <main id="app"></main>
</div>
<div id="printArea" hidden></div>

<script src="config.js"></script>
<script>
/* 연결 주소는 config.js의 API_URL. 비어 있거나 주소 뒤에 ?demo 가 붙으면 예시 데이터로 동작 */
var API_URL = String(window.API_URL || '').trim();
var DEMO = !API_URL || /[?&]demo\b/.test(location.search);
var MODE = !DEMO && (/[?&]page=teacher\b/.test(location.search) || location.hash === '#teacher') ? 'teacher' : 'student';

/* ───────── 문구 (안내문 양식1·2 원문) ───────── */
var AGREE_STUDENT = [
  '본인의 선택과목 변경에 대해 충분한 탐색의 시간을 거쳤습니다.',
  '학교 홈페이지에 게시된 [과목선택 가이드 PDF 파일]을 보고 바꾸고자 하는 과목에 대해 알아보았습니다.',
  '자신의 진로에 대해 부모님과 충분한 상담을 거쳤습니다.',
  '선택과목 변경에 따른 교과서 구매 및 그 외 필요한 사항에 대해 스스로 준비해야 함을 알고 있습니다.',
  '선택과목 변경 이후에 다시 번복할 수 없음에 동의합니다.',
  '변경 희망 과목에 대한 수업이 이미 진행된 경우 해당 부분의 수업을 듣지 못함으로써 발생할 수 있는 불이익에 대해 감수하겠습니다.'
];
var AGREE_PARENT = [
  '자녀의 선택과목 변경에 대해 충분한 탐색의 시간을 거쳤습니다.',
  '자녀의 진로에 대해 자녀와 충분한 상담을 거쳤습니다.',
  '자녀의 선택과목 변경에 따른 교과서 구매 및 그 외 필요한 사항에 대해 스스로 준비해야 함을 알고 있습니다.',
  '선택과목 변경 이후에 다시 번복할 수 없음에 동의합니다.',
  '자녀의 변경 희망 과목에 대한 수업이 이미 진행된 경우 해당 부분의 수업을 듣지 못함으로써 발생할 수 있는 불이익에 대해 감수하겠습니다.'
];
var STATUSES = ['접수', '상담중', '승인', '반려'];

/* ───────── 도우미 ───────── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s||'').replace(/\*/g,'').replace(/\s+/g,'').replace(/III$/,'Ⅲ').replace(/II$/,'Ⅱ').replace(/I$/,'Ⅰ')}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function toast(msg){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function fmtDate(d){if(!d)return'';var p=d.split('-');var w='일월화수목금토'[new Date(+p[0],+p[1]-1,+p[2]).getDay()];return +p[0]+'.'+(+p[1])+'.'+(+p[2])+'.('+w+')'}
function api(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    if(DEMO){setTimeout(function(){try{res(Mock[fn].apply(null,args))}catch(e){rej(e)}},300);return}
    // 본문을 text/plain으로 보내면 Apps Script가 별도 사전 요청 없이 받습니다.
    fetch(API_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args})})
      .then(function(r){return r.json()})
      .then(function(j){if(j.ok)res(j.data);else rej(new Error(j.error))},
            function(){rej(new Error('서버에 연결하지 못했습니다. 잠시 후 다시 시도하고, 계속되면 담임선생님께 알려 주세요.'))});
  });
}
function errMsg(e){return (e&&e.message?e.message:String(e)).replace(/^Exception:\s*/,'')}
function subjInfo(sem,name){var l=(CFG.subjects||{})[sem]||[];for(var i=0;i<l.length;i++)if(norm(l[i][1])===norm(name))return l[i];return null}
function tagHtml(t){return t==='sci'?' <span class="tag">과학 진로</span>':t==='pe'?' <span class="tag">체육특성화</span>':''}

var CFG={subjects:{1:[],2:[]},maxChanges:5};
var GRADE='1'; // 현 1학년 (2027년 2학년 과정 변경)
function pad2(n){n=String(Number(n));return n.length<2?'0'+n:n}
var app=$('#app');

/* ═════════════════ 학생 화면 ═════════════════ */
var S={step:0,cred:null,st:null,form:null,err:''};
function newForm(){return{agreeStudent:[],agreeParent:[],science:'',pe:'',changes:[{sem:'',from:'',to:''}],reason:'',guardian:'',signStudent:'',signParent:''}}

function studentStart(){
  api('getPublicConfig').then(function(c){CFG=c;setPeriod(c);renderStudent()}).catch(function(e){app.innerHTML='<div class="err">'+esc(errMsg(e))+'</div>'});
}
function todayStr(){var d=new Date(),p=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function setPeriod(c){
  var t=todayStr(),open=(!c.start||t>=c.start)&&(!c.end||t<=c.end),span=c.start&&c.end?fmtDate(c.start)+' ~ '+fmtDate(c.end):'';
  $('#notices').innerHTML=open
    ?'<div class="box info">🌺 지금은 <b>선택과목 변경 신청 기간</b>이에요.<br>'+esc(span)+'</div>'
    :'<div class="box alert"><b>🔒 현재 변경 신청 기간이 아닙니다.</b><br>신청 기간: '+esc(span||'미정')+'<br>궁금한 점은 담임선생님께 여쭤 보세요!</div>';
}
function stepper(){
  var names=['기존 과목 확인','확인서 [양식1]','신청서 [양식2]','서명·제출'];
  return '<div class="stepper" aria-label="진행 단계">'+names.map(function(n,i){var k=i+1;return '<div class="'+(S.step===k?'on':S.step>k?'done':'')+'"'+(S.step===k?' aria-current="step"':'')+'><span>'+k+'단계</span>'+n+'</div>'}).join('')+'</div>';
}
function whoBar(){return '<div class="who"><b>'+esc(S.st.id)+' '+esc(S.st.name)+'</b><span class="muted small">과목선택 DB에서 불러온 정보</span><button class="btn ghost small" id="logout" type="button">로그아웃</button></div>'}

function renderStudent(){
  var h='';
  if(S.step===0){
    h+='<div class="box note"><span class="head">💡 <b>안내말씀</b></span>'
      +'과목선택 때 입력한 <b>반·번호·이름·비밀번호(PIN)</b>로 들어와요.<br>'
      +'지금 신청된 과목을 확인하고<br><b>확인서와 신청서</b>를 차례로 작성해요! ✅<br>'
      +'이미 제출했어도 「접수」 상태라면<br>다시 들어와 고치거나 취소할 수 있어요! 🙌<br>'
      +'바꿀 수 있는 과목은 좌측 상단<br>[📖 과목 안내 보기]에서 확인해 보세요!</div>'
      +'<form id="loginForm" class="stack" autocomplete="off">'
      +'<div class="lbl">👤 내 정보 입력하기</div>'
      +'<div class="idrow"><input type="text" value="'+GRADE+'학년" disabled aria-label="학년">'
      +'<input type="text" id="lgCls" inputmode="numeric" maxlength="2" placeholder="반" aria-label="반">'
      +'<input type="text" id="lgNo" inputmode="numeric" maxlength="2" placeholder="번호" aria-label="번호">'
      +'<input type="text" id="lgName" placeholder="이름" aria-label="이름"></div>'
      +'<div class="lbl">🔒 비밀번호(PIN)</div>'
      +'<input type="password" id="lgPw" class="center" placeholder="과목선택 때 정한 비밀번호" aria-label="비밀번호(PIN)">'
      +(S.err?'<div class="err" role="alert">'+esc(S.err)+'</div>':'')
      +'<button class="btn primary big" type="submit">🌷 내 신청 과목 불러오기</button>'
      +'<p class="hint">비밀번호를 잊었다면 담임선생님께 문의하세요.</p></form>';
    app.innerHTML=h;
    $('#loginForm').addEventListener('submit',function(e){
      e.preventDefault();var f=e.target;
      var cls=$('#lgCls').value.replace(/\D/g,''),no=$('#lgNo').value.replace(/\D/g,'');
      var cred={id:cls&&no?GRADE+pad2(cls)+pad2(no):'',name:$('#lgName').value.trim(),pw:$('#lgPw').value.trim()};
      if(!cls||!no||!cred.name||!cred.pw){S.err='반, 번호, 이름, 비밀번호를 모두 입력해 주세요.';return renderStudent()}
      f.classList.add('loading');
      api('studentLogin',cred.id,cred.name,cred.pw).then(function(st){
        S.cred=cred;S.st=st;S.err='';S.form=newForm();
        if(st.request&&st.request.status==='접수'){prefill(st.request)}
        S.step=1;renderStudent();
      }).catch(function(e){S.err=errMsg(e);renderStudent()});
    });
    return;
  }
  if(S.step===5){
    app.innerHTML='<section class="card"><div class="box info"><b>🎉 변경 신청이 접수되었어요!</b></div>'
      +'<p>'+esc(S.st.id)+' '+esc(S.st.name)+' · 접수 '+esc(S.done.time)+'</p>'
      +'<div class="note" style="white-space:pre-line">'+esc(S.done.summary)+'</div>'
      +'<p class="small muted">이제 1주간 상담·숙려 기간입니다. 담임선생님, 진로기획부장, 교육과정부장 선생님과 상담을 진행하세요. 결과는 학교장 결재 후 통보됩니다. 상담 전(「접수」 상태)까지는 이 페이지에서 다시 로그인해 내용을 고치거나 취소할 수 있습니다.</p>'
      +'<div class="row"><button class="btn" id="logout" type="button">처음으로</button></div></section>';
    bindLogout();return;
  }

  h+=stepper()+'<section class="card">'+whoBar();
  if(S.step===1){
    var r=S.st.request;
    if(r){
      h+='<div class="note"><div class="row between"><b>이미 제출한 신청이 있습니다</b><span class="pill st-'+esc(r.status)+'">'+esc(r.status)+'</span></div>'
        +'<div class="small" style="white-space:pre-line;margin-top:4px">'+esc(r.summary)+'</div>'
        +'<div class="small muted">접수 '+esc(r.time)+(r.memo?' · 선생님 메모: '+esc(r.memo):'')+'</div></div>';
    }
    h+='<h2>🌷 지금 신청되어 있는 2학년 과목</h2>'+semView(S.st.sem1,S.st.sem2,[]);
    if(r&&r.status!=='접수'){
      h+='<p class="small">신청이 「'+esc(r.status)+'」 단계라 이 페이지에서 수정할 수 없습니다. 담임선생님께 문의하세요.</p></section>';
      app.innerHTML=h;bindLogout();return;
    }
    h+='<p class="small muted">위 과목이 실제 신청 내용과 다르면 진행하지 말고 담임선생님께 먼저 확인하세요.</p>'
      +'<div class="row between">'+(r?'<button class="btn danger" type="button" id="cancelReq">신청 취소</button>':'<span></span>')
      +'<button class="btn primary" type="button" data-go="2">'+(r?'신청 내용 수정하기':'변경 신청 시작')+'</button></div>';
  }
  if(S.step===2){
    h+='<h2>📝 선택과목 변경 신청 확인서</h2><div class="box note small">모든 문항에 「예」로 답해야 다음으로 넘어가요.<br>「아니오」가 있다면 충분히 상담한 뒤 신청해 주세요.</div>'
      +'<h3>🙋 학생용</h3><div>'+AGREE_STUDENT.map(function(q,i){return qRow('as'+i,q,S.form.agreeStudent[i])}).join('')+'</div>'
      +'<h3>👪 학부모용 <span class="muted small">(보호자와 함께 읽고 체크)</span></h3><div>'+AGREE_PARENT.map(function(q,i){return qRow('ap'+i,q,S.form.agreeParent[i])}).join('')+'</div>'
      +errBox()+'<div class="row between"><button class="btn" type="button" data-go="1">이전</button><button class="btn primary" type="button" data-go="3">다음</button></div>';
  }
  if(S.step===3){
    h+='<h2>🌺 선택과목 변경 신청서</h2>'
      +'<div class="row" style="gap:18px">'+oxField('science','과학중점 희망 여부',S.form.science)+oxField('pe','체육특성화과정 희망 여부',S.form.pe)+'</div>'
      +'<h3>🔁 변경 신청 과목</h3><p class="hint" style="text-align:left">최대 '+CFG.maxChanges+'건, 같은 학기 안에서 1:1로 바꿔요.</p>'
      +'<div id="chgList" style="display:flex;flex-direction:column;gap:8px">'+S.form.changes.map(chgRow).join('')+'</div>'
      +'<div><button class="btn ghost" type="button" id="addChg"'+(S.form.changes.length>=CFG.maxChanges?' disabled':'')+'>+ 변경 과목 추가</button></div>'
      +'<h3>✨ 변경 후 과목</h3><div id="afterView">'+semView(S.st.sem1,S.st.sem2,S.form.changes)+'</div>'
      +'<label class="f">변경 사유 <span class="muted small">성적, 진로 변경 등 사유를 상세하게 (20자 이상)</span><textarea id="reason" placeholder="예: 진로를 생명공학 계열로 바꾸면서 2학기 과학 진로 과목 이수가 필요합니다. …">'+esc(S.form.reason)+'</textarea></label>'
      +'<div class="small muted num" id="reasonLen">'+S.form.reason.length+'자</div>'
      +errBox()+'<div class="row between"><button class="btn" type="button" data-go="2">이전</button><button class="btn primary" type="button" data-go="4">다음</button></div>';
  }
  if(S.step===4){
    h+='<h2>✍️ 서명 및 제출</h2><div class="note small" style="white-space:pre-line"><b>신청 내용</b>\n'
      +esc(cleanChanges().map(function(c){return c.sem+'학기 '+c.from+' → '+c.to}).join('\n'))
      +'\n과학중점 '+esc(S.form.science)+' · 체육특성화 '+esc(S.form.pe)+'</div>'
      +'<label class="f">보호자 성명<input type="text" id="guardian" value="'+esc(S.form.guardian)+'" placeholder="예: 홍판서"></label>'
      +'<div class="sigs">'+sigBox('signStudent','학생 서명 ('+esc(S.st.name)+')')+sigBox('signParent','보호자 서명')+'</div>'
      +'<p class="small muted">위의 사유로 선택과목을 변경하고자 신청서를 제출합니다. 제출 후 담임교사 확인·서명은 교육과정부 출력본에 받습니다.</p>'
      +errBox()+'<div class="row between"><button class="btn" type="button" data-go="3">이전</button><button class="btn primary" type="button" id="submitBtn">변경 신청 제출</button></div>';
  }
  h+='</section>';
  app.innerHTML=h;
  bindLogout();
  $$('[data-go]').forEach(function(b){b.addEventListener('click',function(){go(+b.getAttribute('data-go'))})});
  if(S.step===1&&$('#cancelReq'))bindCancel();
  if(S.step===2)$$('.yn input').forEach(function(i){i.addEventListener('change',readAgree)});
  if(S.step===3)bindChanges();
  if(S.step===4){initSig('signStudent');initSig('signParent');$('#guardian').addEventListener('input',function(e){S.form.guardian=e.target.value});$('#submitBtn').addEventListener('click',submit)}
}
function errBox(){return S.err?'<div class="err" role="alert">'+esc(S.err)+'</div>':''}
function bindLogout(){var b=$('#logout');if(b)b.addEventListener('click',function(){S={step:0,cred:null,st:null,form:null,err:''};renderStudent()})}
function bindCancel(){
  var b=$('#cancelReq'),armed=false;
  b.addEventListener('click',function(){
    if(!armed){armed=true;b.textContent='한 번 더 누르면 취소됩니다';return}
    api('cancelRequest',S.cred.id,S.cred.name,S.cred.pw).then(function(){S.st.request=null;S.form=newForm();toast('신청을 취소했습니다.');renderStudent()}).catch(function(e){toast(errMsg(e))});
  });
}
function prefill(r){
  S.form.agreeStudent=(r.agreeStudent||'').split(',');S.form.agreeParent=(r.agreeParent||'').split(',');
  S.form.science=r.science;S.form.pe=r.pe;S.form.changes=r.changes&&r.changes.length?r.changes:[{sem:'',from:'',to:''}];
  S.form.reason=r.reason||'';S.form.guardian=r.guardian||'';
}
function qRow(id,q,val){
  return '<div class="q"><span class="small">'+esc(q)+'</span><span class="yn" role="radiogroup">'
    +'<label><input type="radio" name="'+id+'" value="예"'+(val==='예'?' checked':'')+'>예</label>'
    +'<label class="no"><input type="radio" name="'+id+'" value="아니오"'+(val==='아니오'?' checked':'')+'>아니오</label></span></div>';
}
function readAgree(){
  S.form.agreeStudent=AGREE_STUDENT.map(function(_,i){var c=$('input[name="as'+i+'"]:checked');return c?c.value:''});
  S.form.agreeParent=AGREE_PARENT.map(function(_,i){var c=$('input[name="ap'+i+'"]:checked');return c?c.value:''});
}
function oxField(id,label,val){
  return '<div class="f" style="display:flex;flex-direction:column;gap:4px"><span class="small" style="font-weight:500">'+label+'</span><span class="yn" role="radiogroup" aria-label="'+label+'">'
    +'<label><input type="radio" name="'+id+'" value="O"'+(val==='O'?' checked':'')+'>O</label>'
    +'<label><input type="radio" name="'+id+'" value="X"'+(val==='X'?' checked':'')+'>X</label></span></div>';
}
function curList(sem){return sem==1?S.st.sem1:S.st.sem2}
function chgRow(c,i){
  var sem=String(c.sem||'');
  var h='<div class="chg" data-i="'+i+'"><select class="sem" aria-label="학기"><option value="">학기</option><option value="1"'+(sem==='1'?' selected':'')+'>1학기</option><option value="2"'+(sem==='2'?' selected':'')+'>2학기</option></select>';
  var usedFrom=S.form.changes.filter(function(x,j){return j!==i&&String(x.sem)===sem}).map(function(x){return norm(x.from)});
  var usedTo=S.form.changes.filter(function(x,j){return j!==i&&String(x.sem)===sem}).map(function(x){return norm(x.to)});
  h+='<select class="from" aria-label="기존 선택 과목"'+(sem?'':' disabled')+'><option value="">기존 과목</option>';
  if(sem)curList(sem).forEach(function(s){if(usedFrom.indexOf(norm(s))<0)h+='<option'+(norm(s)===norm(c.from)?' selected':'')+'>'+esc(s)+'</option>'});
  h+='</select><span class="arr" aria-hidden="true">⇒</span><select class="to" aria-label="변경 신청 과목"'+(sem?'':' disabled')+'><option value="">변경 과목</option>';
  if(sem){
    var cur=curList(sem).map(norm),group='';
    (CFG.subjects[sem]||[]).forEach(function(s){
      if(cur.indexOf(norm(s[1]))>=0||usedTo.indexOf(norm(s[1]))>=0)return;
      if(s[0]!==group){if(group)h+='</optgroup>';group=s[0];h+='<optgroup label="'+esc(group)+'">'}
      var dis=s[2]==='pe'&&S.form.pe!=='O';
      h+='<option value="'+esc(s[1])+'"'+(norm(s[1])===norm(c.to)?' selected':'')+(dis?' disabled':'')+'>'+esc(s[1])+(s[2]==='sci'?' (과학 진로)':s[2]==='pe'?' (체육특성화 대상)':'')+'</option>';
    });
    if(group)h+='</optgroup>';
  }
  h+='</select><button class="btn ghost" type="button" data-del="'+i+'" aria-label="이 줄 삭제">삭제</button></div>';
  return h;
}
function bindChanges(){
  var list=$('#chgList');
  list.addEventListener('change',function(e){
    var row=e.target.closest('.chg');if(!row)return;var i=+row.getAttribute('data-i'),c=S.form.changes[i];
    if(e.target.classList.contains('sem')){c.sem=e.target.value;c.from='';c.to=''}
    if(e.target.classList.contains('from'))c.from=e.target.value;
    if(e.target.classList.contains('to'))c.to=e.target.value;
    refreshChanges();
  });
  list.addEventListener('click',function(e){
    var d=e.target.getAttribute('data-del');if(d==null)return;
    S.form.changes.splice(+d,1);if(!S.form.changes.length)S.form.changes.push({sem:'',from:'',to:''});refreshChanges();
  });
  $('#addChg').addEventListener('click',function(){if(S.form.changes.length<CFG.maxChanges){S.form.changes.push({sem:'',from:'',to:''});refreshChanges()}});
  $$('input[name=science],input[name=pe]').forEach(function(r){r.addEventListener('change',function(){S.form[r.name]=r.value;if(r.name==='pe')refreshChanges()})});
  $('#reason').addEventListener('input',function(e){S.form.reason=e.target.value;$('#reasonLen').textContent=e.target.value.length+'자'});
}
function refreshChanges(){
  $('#chgList').innerHTML=S.form.changes.map(chgRow).join('');
  $('#afterView').innerHTML=semView(S.st.sem1,S.st.sem2,S.form.changes);
  $('#addChg').disabled=S.form.changes.length>=CFG.maxChanges;
}
function semView(s1,s2,changes){
  function col(sem,list){
    var map={};(changes||[]).forEach(function(c){if(String(c.sem)===String(sem)&&c.from&&c.to)map[norm(c.from)]=c.to});
    return '<div class="sem"><h3>'+sem+'학기 · '+list.length+'과목</h3><ol>'+list.map(function(s){
      var to=map[norm(s)];var info=subjInfo(sem,s);
      return to?'<li><span class="out">'+esc(s)+'</span><span class="arrow">→</span><span class="in">'+esc(to)+'</span>'+tagHtml((subjInfo(sem,to)||[])[2])+'</li>'
               :'<li>'+esc(s)+tagHtml(info&&info[2])+'</li>';
    }).join('')+'</ol></div>';
  }
  return '<div class="semcols">'+col(1,s1)+col(2,s2)+'</div>';
}
function cleanChanges(){return S.form.changes.filter(function(c){return c.sem&&c.from&&c.to})}
function go(n){
  S.err='';
  if(n>S.step){
    if(S.step===2){
      readAgree();var a=S.form.agreeStudent.concat(S.form.agreeParent);
      if(a.some(function(x){return !x})){S.err='모든 문항에 답해 주세요.';return renderStudent()}
      if(a.some(function(x){return x==='아니오'})){S.err='「아니오」로 답한 문항이 있습니다. 충분한 탐색과 상담을 마친 뒤 신청해 주세요.';return renderStudent()}
    }

    }

function sigBox(id,label){return '<div class="sig"><div class="row between"><span class="small" style="font-weight:500">'+label+'</span><button class="btn ghost small" type="button" data-clear="'+id+'">지우기</button></div><canvas id="'+id+'" aria-label="'+label+' 입력란"></canvas></div>'}
function initSig(id){
  var cv=$('#'+id),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,drawing=false,last=null,dirty=false;
  function size(){var r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111'}
  size();
  if(S.form[id]){var im=new Image();im.onload=function(){var r=cv.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height)};im.src=S.form[id];dirty=true}
  function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  cv.addEventListener('pointerdown',function(e){drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',function(e){if(!drawing)return;var p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;dirty=true});
  function end(){if(!drawing)return;drawing=false;if(dirty)S.form[id]=exportSig(cv)}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  $('[data-clear="'+id+'"]').addEventListener('click',function(){ctx.clearRect(0,0,cv.width,cv.height);S.form[id]='';dirty=false});
}
function exportSig(cv){ // 저장 용량을 줄이려고 가로 360px로 축소
  var o=document.createElement('canvas'),w=360,h=Math.round(cv.height/cv.width*w);o.width=w;o.height=h;
  o.getContext('2d').drawImage(cv,0,0,w,h);return o.toDataURL('image/png');
}

    });

      }).catch(function(e){toast(errMsg(e));b.disabled=false;b.textContent='과목선택 DB 다시 가져오기'});
    });
