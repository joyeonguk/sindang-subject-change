<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선택과목 변경 신청</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 학교 공문 양식 느낌의 단일 열 작업 화면. 상단 3색 띠(안내문 머리띠) + 단계별 카드 */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#f7f8fa; --ink:#18202e; --muted:#5a6476; --line:#d8dde6;
  --brand:#1d4f91; --brand-ink:#ffffff; --brand-weak:#e7eef8; --amber:#e3a21a; --orange:#e2652a;
  --ok:#1d7a4c; --ok-weak:#e3f3ea; --warn:#a86300; --warn-weak:#fbf0db; --bad:#b3261e; --bad-weak:#fbe7e5;
  --paper:#ffffff; --paper-ink:#111111;
  --f-head:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --sunk:#151a22; --ink:#e6e9ef; --muted:#a0a9b8; --line:#2e3644;
  --brand:#7fb0f0; --brand-ink:#0d1626; --brand-weak:#1e2b40; --amber:#f0b94a; --orange:#f08552;
  --ok:#5fc796; --ok-weak:#16302a; --warn:#f0b45a; --warn-weak:#33280f; --bad:#f08a83; --bad-weak:#3a1c1a;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --sunk:#151a22; --ink:#e6e9ef; --muted:#a0a9b8; --line:#2e3644;
  --brand:#7fb0f0; --brand-ink:#0d1626; --brand-weak:#1e2b40; --amber:#f0b94a; --orange:#f08552;
  --ok:#5fc796; --ok-weak:#16302a; --warn:#f0b45a; --warn-weak:#33280f; --bad:#f08a83; --bad-weak:#3a1c1a;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.55rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

.demo{max-width:880px;margin:12px auto 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;
  border:1px dashed var(--amber);border-radius:var(--r);background:var(--warn-weak);font-size:.86rem}
.demo b{color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font:inherit;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}

.masthead{padding-top:20px;display:flex;flex-direction:column;gap:8px}
.tricolor{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brand) 0 62%,var(--amber) 62% 84%,var(--orange) 84%)}
.mast-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:500}
.period{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;padding:4px 10px;border-radius:999px;background:var(--brand-weak);color:var(--brand);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:500}
input[type=text],input[type=password],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.err{color:var(--bad);background:var(--bad-weak);border-radius:8px;padding:9px 12px;font-size:.9rem}
.note{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem}

ol.steps-guide{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
ol.steps-guide li::marker{font-weight:700;color:var(--brand)}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}

.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;counter-reset:s}
.stepper div{font-size:.8rem;padding:8px 6px 6px;border-top:3px solid var(--line);color:var(--muted);font-weight:500}
.stepper div.on{border-color:var(--brand);color:var(--ink);font-weight:700}
.stepper div.done{border-color:var(--brand);color:var(--muted)}
.stepper span{display:block;font-size:.72rem;letter-spacing:.06em}

.who{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.who b{font-family:var(--f-head);font-size:1.1rem}

.semcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.semcols{grid-template-columns:1fr}}
.sem{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sem h3{background:var(--sunk);padding:8px 12px;border-bottom:1px solid var(--line);font-size:.92rem}
.sem ol{margin:0;padding:6px 12px 8px 2.2em}
.sem li{padding:3px 0}
.sem li.out{color:var(--muted);text-decoration:line-through}
.sem li.in{color:var(--ok);font-weight:700}
.sem li .arrow{color:var(--muted);text-decoration:none;display:inline-block;margin:0 4px;font-weight:400}

.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.yn label{padding:6px 14px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn label:has(input:checked){background:var(--brand);color:var(--brand-ink);font-weight:700}
.yn label.no:has(input:checked){background:var(--bad);color:#fff}
.yn label:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:-2px}

.chg{display:grid;grid-template-columns:86px minmax(0,1fr) 22px minmax(0,1fr) auto;gap:8px;align-items:center}
.chg .arr{text-align:center;color:var(--muted)}
@media (max-width:600px){.chg{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:8px}
  .chg .arr{display:none}.chg select.sem{grid-column:1 / -1}}
.tag{display:inline-block;font-size:.72rem;padding:1px 6px;border-radius:4px;background:var(--brand-weak);color:var(--brand);font-weight:600;vertical-align:1px}

.sigs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.sigs{grid-template-columns:1fr}}
.sig{display:flex;flex-direction:column;gap:6px}
.sig canvas{width:100%;height:140px;background:var(--paper);border:1px dashed var(--muted);border-radius:8px;touch-action:none;cursor:crosshair}

.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-접수{background:var(--brand-weak);color:var(--brand)}
.st-상담중{background:var(--warn-weak);color:var(--warn)}
.st-승인{background:var(--ok-weak);color:var(--ok)}
.st-반려{background:var(--bad-weak);color:var(--bad)}

/* 교사 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;border:0;background:transparent;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-family:var(--f-head);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:var(--sunk);font-weight:600;white-space:nowrap;font-size:.82rem;color:var(--muted)}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:var(--brand-weak)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.delta-up{color:var(--ok);font-weight:700}.delta-dn{color:var(--bad);font-weight:700}
.summary-cell{white-space:pre-line;min-width:220px}

/* 출력용 양식 (A4 종이) */
.paper-wrap{overflow-x:auto}
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:720px;margin:0 auto;padding:28px 30px;border:1px solid var(--line);font-size:13px;line-height:1.5}
.paper h2{text-align:center;font-size:20px;letter-spacing:.3em;margin:4px 0 14px;color:var(--paper-ink)}
.paper .formno{font-size:12px;color:#444}
.paper table{border-collapse:collapse;width:100%;color:var(--paper-ink)}
.paper td,.paper th{border:1px solid #333;padding:6px 8px;vertical-align:middle}
.paper th{background:#eef1f5;font-weight:600}
.paper .ck{width:110px;text-align:center;white-space:nowrap}
.paper .sigline{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:4px}
.paper .sigline img{height:46px;width:auto;max-width:160px}
.paper .foot{text-align:center;font-weight:700;font-size:16px;margin-top:14px;letter-spacing:.1em}
.paper .gap{height:22px}
.paper .page-break{break-before:page}
.drawer-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.loading{opacity:.6;pointer-events:none}

@media print{
  body{background:#fff;padding:0}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .paper{border:0;max-width:none;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="demo" id="demoBar" hidden>
  <b>미리보기</b><span>예시 데이터로 동작하며 저장되지 않습니다.</span>
  <div class="seg" role="group" aria-label="화면 전환">
    <button type="button" id="demoStudent" aria-pressed="true">학생 화면</button>
    <button type="button" id="demoTeacher" aria-pressed="false">교사 화면</button>
  </div>
  <span class="muted" id="demoHint"></span>
</div>

<div class="wrap">
  <header class="masthead">
    <div class="tricolor" aria-hidden="true"></div>
    <div class="mast-row">
      <div>
        <div class="eyebrow">천안신당고등학교 교육과정부</div>
        <h1>2027학년도 선택과목 변경 신청</h1>
      </div>
      <span class="period" id="periodBadge">신청 기간 확인 중</span>
    </div>
  </header>
  <main id="app" class="wrap" style="max-width:none"></main>
</div>
<div id="printArea" hidden></div>

<script>
var MODE_RAW = '<?= mode ?>';
var DEMO = !(window.google && google.script && google.script.run);
var MODE = DEMO ? 'student' : (MODE_RAW === 'teacher' ? 'teacher' : 'student');

/* ───────── 문구 (안내문 양식1·2 원문) ───────── */
var AGREE_STUDENT = [
  '본인의 선택과목 변경에 대해 충분한 탐색의 시간을 거쳤습니다.',
  '학교 홈페이지에 게시된 [과목선택 가이드 PDF 파일]을 보고 바꾸고자 하는 과목에 대해 알아보았습니다.',
  '자신의 진로에 대해 부모님과 충분한 상담을 거쳤습니다.',
  '선택과목 변경에 따른 교과서 구매 및 그 외 필요한 사항에 대해 스스로 준비해야 함을 알고 있습니다.',
  '선택과목 변경 이후에 다시 번복할 수 없음에 동의합니다.',
  '변경 희망 과목에 대한 수업이 이미 진행된 경우 해당 부분의 수업을 듣지 못함으로써 발생할 수 있는 불이익에 대해 감수하겠습니다.'
];
var AGREE_PARENT = [
  '자녀의 선택과목 변경에 대해 충분한 탐색의 시간을 거쳤습니다.',
  '자녀의 진로에 대해 자녀와 충분한 상담을 거쳤습니다.',
  '자녀의 선택과목 변경에 따른 교과서 구매 및 그 외 필요한 사항에 대해 스스로 준비해야 함을 알고 있습니다.',
  '선택과목 변경 이후에 다시 번복할 수 없음에 동의합니다.',
  '자녀의 변경 희망 과목에 대한 수업이 이미 진행된 경우 해당 부분의 수업을 듣지 못함으로써 발생할 수 있는 불이익에 대해 감수하겠습니다.'
];
var STATUSES = ['접수', '상담중', '승인', '반려'];

/* ───────── 도우미 ───────── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s||'').replace(/\*/g,'').replace(/\s+/g,'').replace(/III$/,'Ⅲ').replace(/II$/,'Ⅱ').replace(/I$/,'Ⅰ')}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function toast(msg){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function fmtDate(d){if(!d)return'';var p=d.split('-');var w='일월화수목금토'[new Date(+p[0],+p[1]-1,+p[2]).getDay()];return +p[0]+'.'+(+p[1])+'.'+(+p[2])+'.('+w+')'}
function api(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    if(DEMO){setTimeout(function(){try{res(Mock[fn].apply(null,args))}catch(e){rej(e)}},300);return}
    var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);r[fn].apply(r,args);
  });
}
function errMsg(e){return (e&&e.message?e.message:String(e)).replace(/^Exception:\s*/,'')}
function subjInfo(sem,name){var l=(CFG.subjects||{})[sem]||[];for(var i=0;i<l.length;i++)if(norm(l[i][1])===norm(name))return l[i];return null}
function tagHtml(t){return t==='sci'?' <span class="tag">과학 진로</span>':t==='pe'?' <span class="tag">체육특성화</span>':''}

var CFG={subjects:{1:[],2:[]},maxChanges:5};
var app=$('#app');

/* ═════════════════ 학생 화면 ═════════════════ */
var S={step:0,cred:null,st:null,form:null,err:''};
function newForm(){return{agreeStudent:[],agreeParent:[],science:'',pe:'',changes:[{sem:'',from:'',to:''}],reason:'',guardian:'',signStudent:'',signParent:''}}

function studentStart(){
  api('getPublicConfig').then(function(c){CFG=c;setPeriod(c);renderStudent()}).catch(function(e){app.innerHTML='<div class="err">'+esc(errMsg(e))+'</div>'});
}
function setPeriod(c){
  $('#periodBadge').textContent=c.start&&c.end?('신청 기간 '+fmtDate(c.start)+' ~ '+fmtDate(c.end)):'신청 기간 미정';
}
function stepper(){
  var names=['기존 과목 확인','확인서 [양식1]','신청서 [양식2]','서명·제출'];
  return '<div class="stepper" aria-label="진행 단계">'+names.map(function(n,i){var k=i+1;return '<div class="'+(S.step===k?'on':S.step>k?'done':'')+'"'+(S.step===k?' aria-current="step"':'')+'><span>'+k+'단계</span>'+n+'</div>'}).join('')+'</div>';
}
function whoBar(){return '<div class="who"><b>'+esc(S.st.id)+' '+esc(S.st.name)+'</b><span class="muted small">과목선택 DB에서 불러온 정보</span><button class="btn ghost small" id="logout" type="button">로그아웃</button></div>'}

function renderStudent(){
  var h='';
  if(S.step===0){
    h+='<div class="grid2">'
      +'<form class="card" id="loginForm" autocomplete="off"><h2>본인 확인</h2>'
      +'<p class="muted small">2학년 과목선택 때 등록한 학번·이름·개인 비밀번호를 입력하세요.</p>'
      +'<label class="f">학번 (현재 학번 5자리)<input type="text" id="lgId" inputmode="numeric" maxlength="5" placeholder="예: 10106"></label>'
      +'<label class="f">이름<input type="text" id="lgName" placeholder="예: 홍길동"></label>'
      +'<label class="f">개인 비밀번호<input type="password" id="lgPw" placeholder="과목선택 때 정한 비밀번호"></label>'
      +(S.err?'<div class="err" role="alert">'+esc(S.err)+'</div>':'')
      +'<button class="btn primary" type="submit">기존 신청 과목 불러오기</button>'
      +'<p class="muted small">비밀번호를 잊었다면 담임선생님께 문의하세요.</p></form>'
      +'<section class="card"><h2>변경 신청 안내</h2>'
      +'<p class="small">정기 수강신청 마감 이후 진학 희망 계열·진로 변경 등으로 수강 과목 조정이 필요한 학생을 위한 변경 기간입니다. 분반 편성과 교과서 주문이 끝난 상태이므로 <b>변경은 최소 범위에서 제한적으로 허용</b>됩니다.</p>'
      +'<h3>처리 절차 (교육과정 규정 제13조)</h3>'
      +'<ol class="steps-guide small">'

      +'<label class="f">보호자 성명<input type="text" id="guardian" value="'+esc(S.form.guardian)+'" placeholder="예: 홍판서"></label>'

function errBox(){return S.err?'<div class="err" role="alert">'+esc(S.err)+'</div>':''}
function bindLogout(){var b=$('#logout');if(b)b.addEventListener('click',function(){S={step:0,cred:null,st:null,form:null,err:''};renderStudent()})}
function bindCancel(){
  var b=$('#cancelReq'),armed=false;
  b.addEventListener('click',function(){
    if(!armed){armed=true;b.textContent='한 번 더 누르면 취소됩니다';return}
    api('cancelRequest',S.cred.id,S.cred.name,S.cred.pw).then(function(){S.st.request=null;S.form=newForm();toast('신청을 취소했습니다.');renderStudent()}).catch(function(e){toast(errMsg(e))});
  });
}
function prefill(r){
  S.form.agreeStudent=(r.agreeStudent||'').split(',');S.form.agreeParent=(r.agreeParent||'').split(',');
  S.form.science=r.science;S.form.pe=r.pe;S.form.changes=r.changes&&r.changes.length?r.changes:[{sem:'',from:'',to:''}];
  S.form.reason=r.reason||'';S.form.guardian=r.guardian||'';
}
function qRow(id,q,val){
  return '<div class="q"><span class="small">'+esc(q)+'</span><span class="yn" role="radiogroup">'
    +'<label><input type="radio" name="'+id+'" value="예"'+(val==='예'?' checked':'')+'>예</label>'
    +'<label class="no"><input type="radio" name="'+id+'" value="아니오"'+(val==='아니오'?' checked':'')+'>아니오</label></span></div>';
}
function readAgree(){
  S.form.agreeStudent=AGREE_STUDENT.map(function(_,i){var c=$('input[name="as'+i+'"]:checked');return c?c.value:''});
  S.form.agreeParent=AGREE_PARENT.map(function(_,i){var c=$('input[name="ap'+i+'"]:checked');return c?c.value:''});
}
function oxField(id,label,val){
  return '<div class="f" style="display:flex;flex-direction:column;gap:4px"><span class="small" style="font-weight:500">'+label+'</span><span class="yn" role="radiogroup" aria-label="'+label+'">'
    +'<label><input type="radio" name="'+id+'" value="O"'+(val==='O'?' checked':'')+'>O</label>'
    +'<label><input type="radio" name="'+id+'" value="X"'+(val==='X'?' checked':'')+'>X</label></span></div>';
}
function curList(sem){return sem==1?S.st.sem1:S.st.sem2}
function chgRow(c,i){
  var sem=String(c.sem||'');
  var h='<div class="chg" data-i="'+i+'"><select class="sem" aria-label="학기"><option value="">학기</option><option value="1"'+(sem==='1'?' selected':'')+'>1학기</option><option value="2"'+(sem==='2'?' selected':'')+'>2학기</option></select>';
  var usedFrom=S.form.changes.filter(function(x,j){return j!==i&&String(x.sem)===sem}).map(function(x){return norm(x.from)});
  var usedTo=S.form.changes.filter(function(x,j){return j!==i&&String(x.sem)===sem}).map(function(x){return norm(x.to)});
  h+='<select class="from" aria-label="기존 선택 과목"'+(sem?'':' disabled')+'><option value="">기존 과목</option>';
  if(sem)curList(sem).forEach(function(s){if(usedFrom.indexOf(norm(s))<0)h+='<option'+(norm(s)===norm(c.from)?' selected':'')+'>'+esc(s)+'</option>'});
  h+='</select><span class="arr" aria-hidden="true">⇒</span><select class="to" aria-label="변경 신청 과목"'+(sem?'':' disabled')+'><option value="">변경 과목</option>';
  if(sem){
    var cur=curList(sem).map(norm),group='';
    (CFG.subjects[sem]||[]).forEach(function(s){
      if(cur.indexOf(norm(s[1]))>=0||usedTo.indexOf(norm(s[1]))>=0)return;
      if(s[0]!==group){if(group)h+='</optgroup>';group=s[0];h+='<optgroup label="'+esc(group)+'">'}
      var dis=s[2]==='pe'&&S.form.pe!=='O';
      h+='<option value="'+esc(s[1])+'"'+(norm(s[1])===norm(c.to)?' selected':'')+(dis?' disabled':'')+'>'+esc(s[1])+(s[2]==='sci'?' (과학 진로)':s[2]==='pe'?' (체육특성화 대상)':'')+'</option>';
    });
    if(group)h+='</optgroup>';
  }
  h+='</select><button class="btn ghost" type="button" data-del="'+i+'" aria-label="이 줄 삭제">삭제</button></div>';
  return h;
}
function bindChanges(){
  var list=$('#chgList');
  list.addEventListener('change',function(e){
    var row=e.target.closest('.chg');if(!row)return;var i=+row.getAttribute('data-i'),c=S.form.changes[i];
    if(e.target.classList.contains('sem')){c.sem=e.target.value;c.from='';c.to=''}
    if(e.target.classList.contains('from'))c.from=e.target.value;
    if(e.target.classList.contains('to'))c.to=e.target.value;
    refreshChanges();
  });
  list.addEventListener('click',function(e){
    var d=e.target.getAttribute('data-del');if(d==null)return;
    S.form.changes.splice(+d,1);if(!S.form.changes.length)S.form.changes.push({sem:'',from:'',to:''});refreshChanges();
  });
  $('#addChg').addEventListener('click',function(){if(S.form.changes.length<CFG.maxChanges){S.form.changes.push({sem:'',from:'',to:''});refreshChanges()}});
  $$('input[name=science],input[name=pe]').forEach(function(r){r.addEventListener('change',function(){S.form[r.name]=r.value;if(r.name==='pe')refreshChanges()})});
  $('#reason').addEventListener('input',function(e){S.form.reason=e.target.value;$('#reasonLen').textContent=e.target.value.length+'자'});
}
function refreshChanges(){
  $('#chgList').innerHTML=S.form.changes.map(chgRow).join('');
  $('#afterView').innerHTML=semView(S.st.sem1,S.st.sem2,S.form.changes);
  $('#addChg').disabled=S.form.changes.length>=CFG.maxChanges;
}
function semView(s1,s2,changes){
  function col(sem,list){
    var map={};(changes||[]).forEach(function(c){if(String(c.sem)===String(sem)&&c.from&&c.to)map[norm(c.from)]=c.to});
    return '<div class="sem"><h3>'+sem+'학기 · '+list.length+'과목</h3><ol>'+list.map(function(s){
      var to=map[norm(s)];var info=subjInfo(sem,s);
      return to?'<li><span class="out">'+esc(s)+'</span><span class="arrow">→</span><span class="in">'+esc(to)+'</span>'+tagHtml((subjInfo(sem,to)||[])[2])+'</li>'
               :'<li>'+esc(s)+tagHtml(info&&info[2])+'</li>';
    }).join('')+'</ol></div>';
  }
  return '<div class="semcols">'+col(1,s1)+col(2,s2)+'</div>';
}
function cleanChanges(){return S.form.changes.filter(function(c){return c.sem&&c.from&&c.to})}
function go(n){
  S.err='';
  if(n>S.step){
    if(S.step===2){
      readAgree();var a=S.form.agreeStudent.concat(S.form.agreeParent);
      if(a.some(function(x){return !x})){S.err='모든 문항에 답해 주세요.';return renderStudent()}
      if(a.some(function(x){return x==='아니오'})){S.err='「아니오」로 답한 문항이 있습니다. 충분한 탐색과 상담을 마친 뒤 신청해 주세요.';return renderStudent()}
    }
    if(S.step===3){
      if(!S.form.science||!S.form.pe){S.err='과학중점·체육특성화 희망 여부를 O 또는 X로 골라 주세요.';return renderStudent()}
      var cc=cleanChanges();
      if(!cc.length){S.err='변경할 과목을 1개 이상 골라 주세요. (학기, 기존 과목, 변경 과목)';return renderStudent()}
      if(cc.length!==S.form.changes.length){S.err='비어 있는 변경 줄이 있습니다. 채우거나 삭제해 주세요.';return renderStudent()}
      if(S.form.reason.trim().length<20){S.err='변경 사유를 20자 이상 구체적으로 적어 주세요.';return renderStudent()}
    }
  }
  S.step=n;renderStudent();window.scrollTo(0,0);
}
function sigBox(id,label){return '<div class="sig"><div class="row between"><span class="small" style="font-weight:500">'+label+'</span><button class="btn ghost small" type="button" data-clear="'+id+'">지우기</button></div><canvas id="'+id+'" aria-label="'+label+' 입력란"></canvas></div>'}
function initSig(id){
  var cv=$('#'+id),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,drawing=false,last=null,dirty=false;
  function size(){var r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111'}
  size();
  if(S.form[id]){var im=new Image();im.onload=function(){var r=cv.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height)};im.src=S.form[id];dirty=true}
  function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  cv.addEventListener('pointerdown',function(e){drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',function(e){if(!drawing)return;var p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;dirty=true});
  function end(){if(!drawing)return;drawing=false;if(dirty)S.form[id]=exportSig(cv)}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  $('[data-clear="'+id+'"]').addEventListener('click',function(){ctx.clearRect(0,0,cv.width,cv.height);S.form[id]='';dirty=false});
}
function exportSig(cv){ // 저장 용량을 줄이려고 가로 360px로 축소
  var o=document.createElement('canvas'),w=360,h=Math.round(cv.height/cv.width*w);o.width=w;o.height=h;
  o.getContext('2d').drawImage(cv,0,0,w,h);return o.toDataURL('image/png');
}
function submit(){
  S.err='';
  if(!S.form.guardian.trim()){S.err='보호자 성명을 입력해 주세요.';return renderStudent()}
  if(!S.form.signStudent||!S.form.signParent){S.err='학생과 보호자 서명을 모두 해 주세요.';return renderStudent()}
  var b=$('#submitBtn');b.disabled=true;b.textContent='제출 중…';
  var f=JSON.parse(JSON.stringify(S.form));f.changes=cleanChanges();
  api('submitRequest',S.cred.id,S.cred.name,S.cred.pw,f).then(function(r){S.done=r;S.step=5;renderStudent();window.scrollTo(0,0)})
    .catch(function(e){S.err=errMsg(e);renderStudent()});
}

function bindTeacher(){
  if($('#fQ')){
    $('#fQ').addEventListener('input',function(e){T.q=e.target.value.trim();var p=e.target.selectionStart;renderTeacher();var n=$('#fQ');n.focus();n.setSelectionRange(p,p)});
    $('#fCls').addEventListener('change',function(e){T.cls=e.target.value;renderTeacher()});
    $('#fSt').addEventListener('change',function(e){T.status=e.target.value;renderTeacher()});
    $$('tr[data-id]').forEach(function(tr){
      function open(){api('teacherDetail',T.token,tr.getAttribute('data-id')).then(function(r){T.detail=r;renderTeacher();window.scrollTo(0,0)}).catch(function(e){toast(errMsg(e))})}
      tr.addEventListener('click',open);tr.addEventListener('keydown',function(e){if(e.key==='Enter')open()});
    });
  }
  if($('#back'))$('#back').addEventListener('click',function(){T.detail=null;renderTeacher()});
  if($('#dSave'))$('#dSave').addEventListener('click',function(){
    var st=$('#dSt').value,memo=$('#dMemo').value;
    api('teacherUpdate',T.token,T.detail.id,st,memo).then(function(u){
      T.detail.status=u.status;T.detail.memo=u.memo;T.detail.doneAt=u.doneAt;
      T.data.list.forEach(function(r){if(r.id===T.detail.id){r.status=u.status;r.memo=u.memo}});
      toast('「'+u.status+'」(으)로 저장했습니다.');renderTeacher();
    }).catch(function(e){toast(errMsg(e))});
  });
  if($('#printBtn'))$('#printBtn').addEventListener('click',function(){var p=$('#printArea');p.innerHTML=$('#paperSrc').innerHTML;p.hidden=false;window.print();p.hidden=true});
  if($('#setForm')){
    $('#setForm').addEventListener('submit',function(e){e.preventDefault();
      api('teacherSaveSettings',T.token,{start:$('#stStart').value,end:$('#stEnd').value,newPw:$('#stPw').value})
        .then(function(){T.data.settings.start=$('#stStart').value;T.data.settings.end=$('#stEnd').value;toast('설정을 저장했습니다.')}).catch(function(e){toast(errMsg(e))})});
    var nb=$('#newStore'),armed=false;
    nb.addEventListener('click',function(){
      if(!armed){armed=true;nb.textContent='한 번 더 누르면 새 저장소를 만듭니다';return}
      api('teacherNewStore',T.token).then(function(url){T.data.settings.storeUrl=url;toast('새 저장소를 만들었습니다.');loadTeacher()}).catch(function(e){toast(errMsg(e))});
    });
  }
}
